const screens={
  mobileRule:()=>phone(`<div class="screen-body center mobile-rule-card"><div class="ig-logo-wrap"><img src="${A}instagram-glyph.svg" alt="Instagram"></div><h2>Instagram 앱</h2><p>계정 생성과 프로필 설정은 스마트폰 앱에서 진행합니다.</p><div class="mobile-device-tag">스마트폰 · 세로 화면</div></div>`),

  accounts:go=>phone(`<div class="ig-brand"><div class="ig-logo-wrap"><img src="${A}instagram-glyph.svg" alt="Instagram"></div></div><div class="screen-body"><h2 class="screen-title">Instagram에 로그인</h2><p class="screen-copy">기존 계정은 모두 로그아웃된 상태에서 시작합니다.</p><div class="account-row"><div class="avatar"></div><div><b>기존 계정</b><small>로그아웃됨</small></div><span class="logout">삭제</span></div>${target('새 계정 만들기',go,'btn blue')}</div>`),
  choice:go=>phone(`${head('새 계정 만들기')}<div class="screen-body"><div class="signup-panel"><h2 class="screen-title">휴대폰 번호 입력</h2><p class="screen-copy">휴대폰 번호를 입력하세요. 프로필에는 공개되지 않습니다.</p><div class="phone-entry"><span class="country-code">KR +82</span><span class="phone-placeholder">휴대폰 번호</span></div><div class="btn blue">다음</div><div class="or-divider">또는</div>${target('이메일 주소로 가입',go,'btn email-choice')}</div></div>`),
  email:go=>phone(`${head('이메일 주소 입력')}<div class="screen-body"><h2 class="screen-title">이메일 주소 입력</h2><p class="screen-copy">각 사업마다 다른 전용 이메일을 사용합니다.</p><div class="field"><label>이메일 주소</label><strong>사업별 전용 이메일</strong></div>${target('다음',go,'btn blue')}<div class="btn">휴대폰 번호로 가입</div></div>`),

const stage=document.getElementById('stage');
stage.innerHTML=scenes.map((s,i)=>s.cover?`<section class="slide${i===0?' active':''}"><div class="hero"><p class="eyebrow">${s.ey}</p><h1>${s.title}</h1><p>${s.desc}</p><div class="device-rule"><b>모바일 설정</b><span>스마트폰 세로 화면</span></div></div></section>`:`<section class="slide${i===0?' active':''}"><div class="lesson"><div class="lesson-copy"><span class="step-no">${s.ey}</span><h1>${s.title}</h1><p>${s.desc}</p><span class="say">${s.say}</span></div><div class="phone-stage">${screens[s.screen](Math.min(i+1,scenes.length-1))}</div></div></section>`).join('');
const slides=[...document.querySelectorAll('.slide')];let index=0;const current=document.getElementById('current'),total=document.getElementById('total'),progress=document.getElementById('progress'),prevButton=document.getElementById('prev'),nextButton=document.getElementById('next');const previousChapter='chapter-02-facebook-page.html#/15',nextChapter='chapter-04-account-integration.html#/1';total.textContent=String(slides.length).padStart(2,'0');
function show(n){index=Math.max(0,Math.min(slides.length-1,n));slides.forEach((s,i)=>s.classList.toggle('active',i===index));current.textContent=String(index+1).padStart(2,'0');progress.style.width=`${(index+1)/slides.length*100}%`;prevButton.textContent=index===0?'이전 챕터':'이전';nextButton.textContent=index===slides.length-1?'다음 챕터':'다음';history.replaceState(null,'',`#/${index+1}`)}
function move(delta){if(delta<0&&index===0){location.href=previousChapter;return}if(delta>0&&index===slides.length-1){location.href=nextChapter;return}show(index+delta)}
document.addEventListener('click',e=>{const go=e.target.closest('[data-go]');if(go){e.stopPropagation();show(Number(go.dataset.go))}});prevButton.onclick=()=>move(-1);nextButton.onclick=()=>move(1);document.getElementById('replay').onclick=()=>show(0);document.getElementById('full').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen?.();const nextKeys=new Set(['ArrowRight','ArrowDown','PageDown',' ','Enter','MediaTrackNext']),previousKeys=new Set(['ArrowLeft','ArrowUp','PageUp','Backspace','MediaTrackPrevious']);addEventListener('keydown',e=>{if(e.repeat)return;if(nextKeys.has(e.key)){e.preventDefault();move(1);return}if(previousKeys.has(e.key)){e.preventDefault();move(-1);return}if(e.key==='Home')show(0);if(e.key==='End')show(slides.length-1);if(e.key.toLowerCase()==='r')show(index);if(e.key.toLowerCase()==='f')document.getElementById('full').click()});show(Math.max(0,(parseInt(location.hash.split('/')[1],10)||1)-1));
