<body>
<main class="deck">
  <header class="top"><div class="brand"><b>비즈액터스쿨</b><span>온라인마케팅 교육</span></div><div class="chapter">폴라애드 · 04 Meta 계정 통합</div></header>
  <div class="stage" id="stage"></div>
  <footer class="bottom"><button id="prev">이전</button><button id="next" class="primary">다음</button><button id="replay">다시 보기</button><button id="full">전체 화면</button><div class="counter"><b id="current">1</b> / <span id="total">1</span></div><div class="progress" id="progress"></div></footer>
</main>
<script>
const A='./assets/';
const go=(html,n,cls='')=>n<0?`<button class="${cls}">${html}</button>`:`<button class="${cls} target" data-go="${n}">${html}</button>`;
const logo=(type='page')=>`<div class="avatar ${type==='person'?'person':'logo'}"></div>`;
const grid=()=>`<span class="grid9">${'<i></i>'.repeat(9)}</span>`;
const chrome=(inside,url='facebook.com',extra='')=>`<div class="browser ${extra}"><div class="chrome"><i class="chrome-dot"></i><div class="tab">Facebook</div><div class="tab dim">Instagram</div><div class="tab add">+</div></div><div class="address"><span>‹</span><span>›</span><div class="url">${url}</div><span>☆</span></div><div class="app">${inside}</div></div>`;
const fbHead=(n,profile='person')=>`<div class="fb-head"><div class="fb-logo"><img src="${A}facebook-glyph.svg" alt="Facebook"></div><div class="search">Facebook 검색</div><div class="fb-center"><i></i><i></i><i></i><i></i></div><div class="actions"><button class="round">${grid()}</button><button class="round">◉</button><button class="round">●</button>${go(logo(profile),n,'round profile-switch')}</div></div>`;
const homeBody=()=>`<div class="home"><aside class="left-nav"><div class="nav-row">${logo('person')}<b>개인 프로필</b></div><div class="nav-row"><i>친</i>친구</div><div class="nav-row"><i>그</i>그룹</div><div class="nav-row"><i>릴</i>릴스</div></aside><main class="feed"><div class="compose">무슨 생각을 하고 계신가요?</div><div class="fake" style="width:38%"></div><div class="fake" style="width:72%"></div><div class="fake big"></div></main><aside class="right-rail"><div></div><div></div><div></div></aside></div>`;
const managerNav=(targetLabel,n)=>`<aside class="manager-nav"><h3>페이지 관리하기</h3><div class="brand-row">${logo()}<span>폴라애드 앱개발</span></div>${['프로페셔널 대시보드','인사이트','플래너','수익화','광고 센터','광고 만들기','Instagram 게시물 홍보하기','설정','Meta Business Suite'].map((x,i)=>x===targetLabel?go(`<i>${i+1}</i>${x}`,n,'nav-row'): `<div class="nav-row"><i>${i+1}</i>${x}</div>`).join('')}</aside>`;
const managerMain=()=>`<main class="manager-main"><div class="cover"></div><div class="page-head">${logo()}<div style="margin-left:15px"><h3>폴라애드 앱개발</h3><p>팔로워 0명 · 소프트웨어 기업</p></div><div class="page-actions"><button class="small-btn blue">프로페셔널 대시보드</button><button class="small-btn">수정</button><button class="small-btn">광고하기</button></div></div><div class="feed" style="margin-top:13px;height:170px"><div class="fake" style="width:28%"></div><div class="fake big" style="height:95px"></div></div></main>`;

const slides=[...document.querySelectorAll('.slide')];let index=0;const current=document.getElementById('current'),total=document.getElementById('total'),progress=document.getElementById('progress'),prevButton=document.getElementById('prev'),nextButton=document.getElementById('next');const previousChapter='chapter-03-instagram-account.html#/30',nextChapter='chapter-05-ad-payment.html#/1';total.textContent=String(slides.length).padStart(2,'0');
function show(n){index=Math.max(0,Math.min(slides.length-1,n));slides.forEach((s,i)=>s.classList.toggle('active',i===index));current.textContent=String(index+1).padStart(2,'0');progress.style.width=`${(index+1)/slides.length*100}%`;prevButton.textContent=index===0?'이전 챕터':'이전';nextButton.textContent=index===slides.length-1?'다음 챕터':'다음';history.replaceState(null,'',`#/${index+1}`)}
function move(delta){if(delta<0&&index===0){location.href=previousChapter;return}if(delta>0&&index===slides.length-1){location.href=nextChapter;return}show(index+delta)}
document.addEventListener('click',e=>{const target=e.target.closest('[data-go]');if(target){e.stopPropagation();show(Number(target.dataset.go))}});prevButton.onclick=()=>move(-1);nextButton.onclick=()=>move(1);document.getElementById('replay').onclick=()=>show(0);document.getElementById('full').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen?.();const nextKeys=new Set(['ArrowRight','ArrowDown','PageDown',' ','Enter','MediaTrackNext']),previousKeys=new Set(['ArrowLeft','ArrowUp','PageUp','Backspace','MediaTrackPrevious']);addEventListener('keydown',e=>{if(e.repeat)return;if(nextKeys.has(e.key)){e.preventDefault();move(1);return}if(previousKeys.has(e.key)){e.preventDefault();move(-1);return}if(e.key==='Home')show(0);if(e.key==='End')show(slides.length-1);if(e.key.toLowerCase()==='r')show(index);if(e.key.toLowerCase()==='f')document.getElementById('full').click()});show(Math.max(0,(parseInt(location.hash.split('/')[1],10)||1)-1));
