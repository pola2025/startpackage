px}.recovery-form label{display:block;font-size:11px;font-weight:750;margin:10px 0 4px}.recovery-field{width:100%;height:34px;border:1px solid #e0e3e8;border-radius:6px;background:#f8f9fb;padding:9px;color:#939ba8;font-size:11px}.recovery-link{border:0;background:none;color:#0866ff;font-weight:850;font-size:11px;padding:8px 0;margin-top:8px;text-align:left}.recovery-primary{width:100%;border:0;border-radius:8px;background:#0866ff;color:#fff;font-weight:850;padding:10px;font-size:11px}.recovery-guide{min-width:0;flex:1;max-width:380px}.recovery-guide .count{display:inline-block;font-size:12px;font-weight:900;color:#0866ff;letter-spacing:.08em}.recovery-guide h2{font-size:clamp(22px,2vw,31px);line-height:1.13;margin:9px 0}.recovery-guide p{font-size:clamp(13px,1.05vw,16px);line-height:1.5;color:#5a677b;margin:0 0 17px}.recovery-guide .cue{border-left:4px solid #0866ff;padding:8px 10px;background:#e2edff;border-radius:0 8px 8px 0;color:#174a92;font-size:13px;font-weight:850}.recovery-guide .version{display:block;margin-top:18px;font-size:11px;line-height:1.4;color:#738094}.recovery-guide button{border:1px solid #cad7e8;background:#fff;border-radius:8px;padding:8px 11px;margin-top:15px;font-size:11px;font-weight:800;color:#39516f;cursor:pointer}.recovery-confirm{padding:18px 13px;text-align:center}.recovery-confirm .symbol{width:56px;height:56px;border-radius:50%;background:#e8f2ff;color:#0866ff;display:grid;place-items:center;margin:6px auto 13px;font-size:27px}.recovery-confirm h3{font-size:17px;margin:0}.recovery-finish{width:100%;max-width:780px;height:min(66vh,590px);min-height:490px;padding:22px;background:#f5f7fa;border-radius:22px;display:grid;grid-template-columns:1fr 1fr;gap:15px;box-shadow:0 30px 85px rgba(1,11,34,.46)}.recovery-card{border-radius:15px;background:#fff;border:1px solid #dce3ec;padding:23px;display:flex;flex-direction:column;justify-content:center;color:#172034}.recovery-card .num{color:#0866ff;font-size:14px;font-weight:950}.recovery-card h2{font-size:26px;margin:12px 0}.recovery-card p{font-size:16px;line-height:1.45;color:#596679;margin:0}.recovery-card.blue{background:#eaf2ff;border-color:#bcd5ff}.recovery-card.blue h2{color:#0a4595}@media(max-width:1100px){.recovery-shell{padding:10px;gap:10px}.recovery-phone{width:245px;flex-basis:245px}.recovery-guide h2{font-size:20px}.recovery-guide p{font-size:12px}.recovery-card{padding:15px}.recovery-card h2{font-size:21px}.recovery-card p{font-size:13px}}@media(max-width:850px){.recovery-guide{display:none}.recovery-shell{max-width:330px}}

<body>
<main class="deck">
  <header class="top"><div class="brand"><b>비즈액터스쿨</b><span>온라인마케팅 교육</span></div><div class="chapter">폴라애드 · 04 Meta 계정 통합</div></header>
  <div class="stage" id="stage"></div>
  <footer class="bottom"><button id="prev">이전</button><button id="next" class="primary">다음</button><button id="replay">다시 보기</button><button id="full">전체 화면</button><div class="counter"><b id="current">1</b> / <span id="total">1</span></div><div class="progress" id="progress"></div></footer>
</main>
<script>
const A='./assets/';
const go=(html,n,cls='')=>n<0?`<button class="${cls}">${html}</button>`:`<button class="${cls} target" data-go="${n}">${html}</button>`;
const logo=(type='page')=>`<div class="avatar ${type==='person'?'person':'logo'}"></div>`;
const grid=()=>`<span class="grid9">${'<i></i>'.repeat(9)}</span>`;
const chrome=(inside,url='facebook.com',extra='')=>`<div class="browser ${extra}"><div class="chrome"><i class="chrome-dot"></i><div class="tab">Facebook</div><div class="tab dim">Instagram</div><div class="tab add">+</div></div><div class="address"><span>‹</span><span>›</span><div class="url">${url}</div><span>☆</span></div><div class="app">${inside}</div></div>`;
const fbHead=(n,profile='person')=>`<div class="fb-head"><div class="fb-logo"><img src="${A}facebook-glyph.svg" alt="Facebook"></div><div class="search">Facebook 검색</div><div class="fb-center"><i></i><i></i><i></i><i></i></div><div class="actions"><button class="round">${grid()}</button><button class="round">◉</button><button class="round">●</button>${go(logo(profile),n,'round profile-switch')}</div></div>`;
const homeBody=()=>`<div class="home"><aside class="left-nav"><div class="nav-row">${logo('person')}<b>개인 프로필</b></div><div class="nav-row"><i>친</i>친구</div><div class="nav-row"><i>그</i>그룹</div><div class="nav-row"><i>릴</i>릴스</div></aside><main class="feed"><div class="compose">무슨 생각을 하고 계신가요?</div><div class="fake" style="width:38%"></div><div class="fake" style="width:72%"></div><div class="fake big"></div></main><aside class="right-rail"><div></div><div></div><div></div></aside></div>`;
const managerNav=(targetLabel,n)=>`<aside class="manager-nav"><h3>페이지 관리하기</h3><div class="brand-row">${logo()}<span>폴라애드 앱개발</span></div>${['프로페셔널 대시보드','인사이트','플래너','수익화','광고 센터','광고 만들기','Instagram 게시물 홍보하기','설정','Meta Business Suite'].map((x,i)=>x===targetLabel?go(`<i>${i+1}</i>${x}`,n,'nav-row'): `<div class="nav-row"><i>${i+1}</i>${x}</div>`).join('')}</aside>`;
const managerMain=()=>`<main class="manager-main"><div class="cover"></div><div class="page-head">${logo()}<div style="margin-left:15px"><h3>폴라애드 앱개발</h3><p>팔로워 0명 · 소프트웨어 기업</p></div><div class="page-actions"><button class="small-btn blue">프로페셔널 대시보드</button><button class="small-btn">수정</button><button class="small-btn">광고하기</button></div></div><div class="feed" style="margin-top:13px;height:170px"><div class="fake" style="width:28%"></div><div class="fake big" style="height:95px"></div></div></main>`;
const pageScreen=(n,target='설정',profileTarget=false,extra='')=>chrome(`${fbHead(profileTarget?n:-1,'page')}<div class="page-manager">${managerNav(target,n)}${managerMain()}</div>`,'facebook.com',extra);
const linkedAccountsIcon='<svg class="linked-account-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M10.2 13.8a4.6 4.6 0 0 0 6.5 0l2.2-2.2a4.6 4.6 0 0 0-6.5-6.5l-1.3 1.3"></path><path d="M13.8 10.2a4.6 4.6 0 0 0-6.5 0l-2.2 2.2a4.6 4.6 0 0 0 6.5 6.5l1.3-1.3"></path></svg>';
const settingsNav=(target,n)=>`<aside class="settings-nav"><h3>설정 및 개인정보</h3>${['설정','페이지 설정','페이지 액세스','연결된 계정','개인정보 보호','알림','결제'].map(x=>{const label=x==='연결된 계정'?`${linkedAccountsIcon}<span>${x}</span>`:x;return x===target?go(label,n,'settings-row active'): `<div class="settings-row">${label}</div>`}).join('')}</aside>`;
const bizNav=(target,n)=>`<aside class="biz-nav"><div class="meta-brand"><img src="${A}meta-glyph.svg" alt="Meta">비즈니스 설정</div>${['사용자','계정','페이지','광고 계정','비즈니스 자산 그룹','Instagram 계정','데이터 소스','요청','결제'].map(x=>x===target?go(x,n,'settings-row active'):`<div class="settings-row">${x}</div>`).join('')}</aside>`;
const recoverySteps=[
  {title:'프로필에서 메뉴 열기',desc:'Instagram 앱에 로그인된 상태에서 오른쪽 아래 프로필을 연 뒤, 오른쪽 위 세 줄 메뉴를 누릅니다.',cue:'휴대폰 화면의 세 줄 메뉴를 눌러 보세요.'},
  {title:'계정 센터 선택',desc:'설정 및 활동 화면 위쪽의 Meta 계정 센터를 엽니다.',cue:'계정 센터를 눌러 보세요.'},
  {title:'비밀번호 및 보안',desc:'계정 센터의 계정 설정에서 비밀번호 및 보안으로 이동합니다.',cue:'비밀번호 및 보안을 눌러 보세요.'},
  {title:'비밀번호 변경',desc:'로그인 및 복구 항목의 비밀번호 변경을 선택합니다.',cue:'비밀번호 변경을 눌러 보세요.'},
  {title:'Instagram 계정 선택',desc:'여러 계정이 보이면 비밀번호를 재설정할 Instagram 계정을 고릅니다.',cue:'Instagram 계정을 눌러 보세요.'},
  {title:'비밀번호를 잊으셨나요?',desc:'현재 비밀번호가 맞지 않으면 입력칸 아래의 파란 글씨를 누릅니다.',cue:'파란 글씨를 눌러 보세요.'},
  {title:'재설정 안내 확인',desc:'Instagram이 안내한 이메일 또는 휴대폰에서 재설정 링크를 확인합니다.',cue:'다음 장에서 새 비밀번호 설정과 PC 로그인을 확인하세요.'}
];
const recoveryRow=(icon,title,detail,next)=>{const tag=next===undefined?'div':'button';return `<${tag}${next===undefined?'':' type="button"'} class="recovery-row${next===undefined?'':' recovery-tap'}"${next===undefined?'':` data-recovery-next="${next}"`}><span class="recovery-icon">${icon}</span><span><strong>${title}</strong>${detail?`<small>${detail}</small>`:''}</span><span class="chevron">›</span></${tag}>`};
const recoveryPhoneContent=step=>{
  if(step===0)return `<div class="recovery-head"><strong>polarad_app</strong><button type="button" class="recovery-tap" data-recovery-next="1" aria-label="세 줄 메뉴 열기">☰</button></div><div class="recovery-profile"><div class="recovery-profile-stats"><div class="recovery-avatar" role="img" aria-label="폴라애드 프로필"></div><span><b>—</b>게시물</span><span><b>—</b>팔로워</span><span><b>—</b>팔로잉</span></div><p><b>폴라애드 앱개발</b><br>우리 브랜드의 소식을 전합니다.</p><div class="recovery-profile-actions"><span>프로필 편집</span><span>프로필 공유</span></div><div class="recovery-fake-grid"><i></i><i></i><i></i></div></div>`;
  const header=(title)=>`<div class="recovery-head"><button type="button" data-recovery-back="1" aria-label="이전 앱 화면">‹</button><strong>${title}</strong></div>`;
  if(step===1)return `${header('설정 및 활동')}<div class="recovery-content"><div class="recovery-meta-card"><div class="recovery-meta"><img src="${A}meta-glyph.svg" alt="Meta">Meta</div><p>연결된 환경, 계정 설정과 개인정보를 관리하세요.</p>${recoveryRow('◎','계정 센터','Meta 계정 설정',2)}</div><div class="recovery-kicker">Instagram 사용 방법</div>${recoveryRow('◉','알림','',undefined)}${recoveryRow('◷','내 활동','',undefined)}</div>`;
  if(step===2)return `${header('계정 센터')}<div class="recovery-content"><div class="recovery-meta"><img src="${A}meta-glyph.svg" alt="Meta">Meta</div><div class="recovery-kicker">계정 설정</div>${recoveryRow('♙','개인정보','',undefined)}${recoveryRow('⚿','비밀번호 및 보안','로그인 및 복구',3)}${recoveryRow('☷','광고 기본 설정','',undefined)}</div>`;
  if(step===3)return `${header('비밀번호 및 보안')}<div class="recovery-content"><div class="recovery-kicker">로그인 및 복구</div>${recoveryRow('⚿','비밀번호 변경','계정의 비밀번호 업데이트',4)}${recoveryRow('▣','2단계 인증','',undefined)}${recoveryRow('◷','로그인한 위치','',undefined)}</div>`;
  if(step===4)return `${header('비밀번호 변경')}<div class="recovery-content"><p style="font-size:11px;color:#627086;line-height:1.45">비밀번호를 변경할 계정을 선택하세요.</p>${recoveryRow(`<img src="${A}instagram-glyph.svg" alt="" style="width:22px;height:22px">`,'polarad_app','Instagram',5)}${recoveryRow('f','다른 계정','Facebook',undefined)}</div>`;
  if(step===5)return `${header('비밀번호 변경')}<div class="recovery-content recovery-form"><div class="recovery-meta"><img src="${A}instagram-glyph.svg" alt="Instagram">polarad_app</div><p>계정 보호를 위해 새 비밀번호를 설정할 수 있습니다.</p><label>현재 비밀번호</label><div class="recovery-field">현재 비밀번호</div><label>새 비밀번호</label><div class="recovery-field">새 비밀번호</div><label>새 비밀번호 재입력</label><div class="recovery-field">새 비밀번호 재입력</div><button type="button" class="recovery-link recovery-tap" data-recovery-next="6">비밀번호를 잊으셨나요?</button><button type="button" class="recovery-primary" disabled>비밀번호 변경</button></div>`;
  return `${header('비밀번호 재설정')}<div class="recovery-confirm"><div class="symbol">✉</div><h3>재설정 안내를 확인하세요</h3><p>Instagram에서 표시하는 이메일 또는 휴대폰으로 받은 안내에 따라 새 비밀번호를 만듭니다.</p><button type="button" class="recovery-primary" data-go="3">다음 장에서 PC 로그인 확인</button></div>`;
};

const stage=document.getElementById('stage');stage.innerHTML=scenes.map((s,i)=>s.cover?`<section class="slide${i===0?' active':''}"><div class="hero"><p class="eyebrow">${s.ey}</p><h1>${s.title}</h1><p>${s.desc}</p><div class="hero-route"><span>개인 프로필</span><i></i><span>Facebook 페이지</span><i></i><span>Instagram</span><i></i><span>Business Suite</span></div></div></section>`:`<section class="slide"><div class="lesson"><div class="lesson-copy"><span class="step-no">${s.ey}</span><h1>${s.title}</h1><p>${s.desc}</p><span class="say">${s.say}</span></div><div class="screen-stage">${screens[s.screen](Math.min(i+1,scenes.length-1))}</div></div></section>`).join('');
const recoveryApp=document.getElementById('recoveryApp');
function renderRecovery(step){const safe=Math.max(0,Math.min(recoverySteps.length-1,step));recoveryApp.dataset.step=String(safe);document.getElementById('recoveryPhoneBody').innerHTML=recoveryPhoneContent(safe);document.getElementById('recoveryCount').textContent=`앱 화면 ${safe+1} / ${recoverySteps.length}`;document.getElementById('recoveryTitle').textContent=recoverySteps[safe].title;document.getElementById('recoveryDesc').textContent=recoverySteps[safe].desc;document.getElementById('recoveryCue').textContent=recoverySteps[safe].cue}
renderRecovery(0);
const slides=[...document.querySelectorAll('.slide')];let index=0;const current=document.getElementById('current'),total=document.getElementById('total'),progress=document.getElementById('progress'),prevButton=document.getElementById('prev'),nextButton=document.getElementById('next');const previousChapter='chapter-03-instagram-account.html#/30',nextChapter='chapter-05-ad-payment.html#/1';total.textContent=String(slides.length).padStart(2,'0');
function show(n){const previous=index;index=Math.max(0,Math.min(slides.length-1,n));if(index===2&&previous!==2)renderRecovery(0);slides.forEach((s,i)=>s.classList.toggle('active',i===index));current.textContent=String(index+1).padStart(2,'0');progress.style.width=`${(index+1)/slides.length*100}%`;prevButton.textContent=index===0?'이전 챕터':'이전';nextButton.textContent=index===slides.length-1?'다음 챕터':'다음';history.replaceState(null,'',`#/${index+1}`)}
function move(delta){if(delta<0&&index===0){location.href=previousChapter;return}if(delta>0&&index===slides.length-1){location.href=nextChapter;return}show(index+delta)}
document.addEventListener('click',e=>{const advance=e.target.closest('[data-recovery-next]');if(advance){renderRecovery(Number(advance.dataset.recoveryNext));return}if(e.target.closest('[data-recovery-back]')){renderRecovery(Number(recoveryApp.dataset.step)-1);return}if(e.target.closest('#recoveryRestart')){renderRecovery(0);return}const target=e.target.closest('[data-go]');if(target){e.stopPropagation();show(Number(target.dataset.go))}});prevButton.onclick=()=>move(-1);nextButton.onclick=()=>move(1);document.getElementById('replay').onclick=()=>show(0);document.getElementById('full').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen?.();const nextKeys=new Set(['ArrowRight','ArrowDown','PageDown',' ','Enter','MediaTrackNext']),previousKeys=new Set(['ArrowLeft','ArrowUp','PageUp','Backspace','MediaTrackPrevious']);addEventListener('keydown',e=>{if(e.repeat)return;if(e.target.closest?.('.recovery-shell')&&(e.key==='Enter'||e.key===' '))return;if(nextKeys.has(e.key)){e.preventDefault();move(1);return}if(previousKeys.has(e.key)){e.preventDefault();move(-1);return}if(e.key==='Home')show(0);if(e.key==='End')show(slides.length-1);if(e.key.toLowerCase()==='r')show(index);if(e.key.toLowerCase()==='f')document.getElementById('full').click()});show(Math.max(0,(parseInt(location.hash.split('/')[1],10)||1)-1));
