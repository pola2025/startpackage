<body>
<main class="deck">
  <header class="top"><div class="brand"><b>비즈액터스쿨</b><span>온라인마케팅 교육</span></div><div class="chapter">폴라애드 · 05 광고 결제 설정</div></header>
  <div class="stage" id="stage"></div>
  <footer class="bottom"><button id="prev">이전</button><button id="next" class="primary">다음</button><button id="replay">다시 보기</button><button id="full">전체 화면</button><div class="counter"><b id="current">01</b> / <span id="total">14</span></div><div class="progress" id="progress"></div></footer>
</main>
<script>
const A='./assets/';
const go=(html,n,cls='',label='')=>n<0?`<button class="${cls}">${html}</button>`:`<button class="${cls} target" data-go="${n}"${label?` data-detail-label="${label}"`:''}>${html}</button>`;
const chrome=(inside,url='business.facebook.com')=>`<div class="browser"><div class="chrome"><i class="chrome-dot"></i><div class="tab">Meta Business Suite</div><div class="tab dim">광고 관리자</div><div class="tab add">+</div></div><div class="address"><span>‹</span><span>›</span><div class="url">${url}</div><span>☆</span></div><div class="app">${inside}</div></div>`;
const suiteNav=(target,n)=>`<aside class="suite-nav"><div class="meta-brand"><img src="${A}meta-glyph.svg" alt="Meta">Business Suite</div>${['홈','알림','받은 메시지함','잠재 고객 센터','콘텐츠','플래너','광고','광고 관리자','인사이트'].map((x,i)=>x===target?go(`<i>${i+1}</i>${x}`,n,'nav-row active',x):`<div class="nav-row"><i>${i+1}</i>${x}</div>`).join('')}<div class="nav-spacer"></div><div class="nav-row"><i>설</i>설정</div></aside>`;
const suiteMain=()=>`<main class="suite-main"><h2>폴라애드 앱개발</h2><div class="kpis"><div class="kpi">Facebook<b>0</b></div><div class="kpi">Instagram<b>0</b></div><div class="kpi">광고 결과<b>0</b></div></div><div class="preview"><div class="fake" style="width:34%"></div><div class="fake" style="width:68%"></div><div class="fake big"></div></div></main>`;
const adsRail=()=>`<aside class="ads-rail"><div class="rail-logo"><img src="${A}meta-glyph.svg" alt="Meta"></div><div class="rail-icon active">광고</div><div class="rail-icon">도구</div><div class="rail-icon">보고</div><div style="flex:1"></div><div class="rail-icon">설정</div></aside>`;
const adsMenu=(target,n)=>`<aside class="ads-menu"><h3>모든 도구</h3>${['광고 관리자','광고 보고서','잠재 고객 센터','청구 및 결제','결제 설정','비즈니스 설정'].map(x=>x===target?go(x,n,'menu-row active',x):`<div class="menu-row">${x}</div>`).join('')}</aside>`;
const adsHead=(title='광고 관리자',account='폴라애드 광고 계정')=>`<header class="ads-head"><b>${title}</b><div class="account-select">${account}</div></header>`;

const paymentBody=(button='')=>`<h2>결제 개요</h2><p>광고 계정의 잔액, 결제수단, 청구 내역을 관리합니다.</p><div class="panel-grid"><div class="stack"><div class="panel"><h3>현재 잔액</h3><div class="balance">₩0</div><p>현재 결제할 금액이 없습니다.</p></div><div class="panel"><h3>결제수단</h3><p>광고비 결제에 사용할 수단을 등록합니다.</p>${button}</div><div class="panel"><h3>결제 활동</h3><p>최근 광고비 지출이 없습니다.</p></div></div><div class="stack"><div class="panel"><h3>청구서 및 거래</h3><p>거래 내역과 청구서를 확인합니다.</p></div><div class="panel"><h3>계정 지출 한도</h3><p>광고 계정 전체 지출 한도를 관리합니다.</p></div></div></div>`;

function conceptSlide(s){if(s.concept==='compare')return `<section class="slide"><div class="concept"><div class="concept-copy"><span class="step-no">${s.ey}</span><h1>${s.title}</h1><p>${s.desc}</p></div><div class="compare"><article class="route-card active"><small>KRW · 원화 계정</small><h2>Toss 충전결제 가능</h2><p>Toss Payments로 먼저 충전하고 잔액에서 광고비가 차감됩니다.</p><div class="route-badge"><span class="toss-word">toss payments</span></div></article><article class="route-card"><small>USD · 달러 계정</small><h2>해외결제 카드 후불제</h2><p>해외결제 가능한 신용카드 또는 체크카드로 자동 청구됩니다.</p><div class="route-badge">신용카드 · 체크카드</div></article></div></div></section>`;if(s.concept==='threshold')return `<section class="slide"><div class="concept"><div class="concept-copy"><span class="step-no">${s.ey}</span><h1>${s.title}</h1><p>${s.desc}</p><span class="say">광고가 줄어든 것이 아니라 청구가 나뉘는 구조</span></div><div class="threshold-flow"><div class="threshold-row active"><b>처음</b><strong>작은 결제 기준액으로 결제 확인</strong></div><div class="threshold-row"><b>정상 결제</b><strong>결제 성공 이력이 계정에 누적</strong></div><div class="threshold-row"><b>이후</b><strong>결제 기준액이 점차 높아질 수 있음</strong></div></div></div></section>`;return `<section class="slide"><div class="concept"><div class="concept-copy"><span class="step-no">${s.ey}</span><h1>${s.title}</h1><p>${s.desc}</p></div><div class="done-grid"><article class="done-card"><div class="done-no">1</div><h2>광고 계정</h2><p>결제수단을 등록할 계정 이름</p></article><article class="done-card"><div class="done-no">2</div><h2>통화</h2><p>KRW 충전 또는 USD 후불</p></article><article class="done-card"><div class="done-no">3</div><h2>기본 수단</h2><p>등록 완료와 기본 결제수단 표시</p></article></div></div></section>`}
const stage=document.getElementById('stage');stage.innerHTML=scenes.map((s,i)=>s.cover?`<section class="slide${i===0?' active':''}"><div class="hero"><p class="eyebrow">${s.ey}</p><h1>${s.title}</h1><p>${s.desc}</p><div class="hero-route"><span>광고 관리자</span><i></i><span>청구 및 결제</span><i></i><span>결제수단</span></div></div></section>`:s.concept?conceptSlide(s):`<section class="slide"><div class="lesson"><div class="lesson-copy"><span class="step-no">${s.ey}</span><h1>${s.title}</h1><p>${s.desc}</p><span class="say">${s.say}</span></div><div class="screen-stage">${screens[s.screen](Math.min(i+1,scenes.length-1))}</div></div></section>`).join('');
const slides=[...document.querySelectorAll('.slide')];let index=0;const current=document.getElementById('current'),total=document.getElementById('total'),progress=document.getElementById('progress'),prevButton=document.getElementById('prev'),nextButton=document.getElementById('next');const previousChapter='chapter-04-account-integration.html#/25',nextChapter='chapter-06-advertiser-safety.html#/1';total.textContent=String(slides.length).padStart(2,'0');
function show(n){index=Math.max(0,Math.min(slides.length-1,n));slides.forEach((s,i)=>s.classList.toggle('active',i===index));current.textContent=String(index+1).padStart(2,'0');progress.style.width=`${(index+1)/slides.length*100}%`;prevButton.textContent=index===0?'이전 챕터':'이전';nextButton.textContent=index===slides.length-1?'다음 챕터':'다음';history.replaceState(null,'',`#/${index+1}`)}
function move(delta){if(delta<0&&index===0){location.href=previousChapter;return}if(delta>0&&index===slides.length-1){location.href=nextChapter;return}show(index+delta)}
document.addEventListener('click',e=>{const target=e.target.closest('[data-go]');if(target){e.stopPropagation();show(Number(target.dataset.go))}});prevButton.onclick=()=>move(-1);nextButton.onclick=()=>move(1);document.getElementById('replay').onclick=()=>show(0);document.getElementById('full').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen?.();const nextKeys=new Set(['ArrowRight','ArrowDown','PageDown',' ','Enter','MediaTrackNext']),previousKeys=new Set(['ArrowLeft','ArrowUp','PageUp','Backspace','MediaTrackPrevious']);addEventListener('keydown',e=>{if(e.repeat)return;if(nextKeys.has(e.key)){e.preventDefault();move(1);return}if(previousKeys.has(e.key)){e.preventDefault();move(-1);return}if(e.key==='Home')show(0);if(e.key==='End')show(slides.length-1);if(e.key.toLowerCase()==='r')show(index);if(e.key.toLowerCase()==='f')document.getElementById('full').click()});show(Math.max(0,(parseInt(location.hash.split('/')[1],10)||1)-1));
</script>
