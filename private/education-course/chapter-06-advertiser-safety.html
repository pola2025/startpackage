  if(s.concept==='auth')return `<section class="slide"><div class="concept"><div class="concept-copy"><span class="step-no">${s.ey}</span><h1>${s.title}</h1><p>${s.desc}</p></div><div class="rule-stage"><div class="rule-line active"><b>비밀번호</b><strong>입력하지 않기</strong></div><div class="rule-line"><b>인증번호</b><strong>알려주지 않기</strong></div><div class="rule-line"><b>QR · 코드</b><strong>스캔·연결하지 않기</strong></div></div></div></section>`;
  if(s.concept==='mailrule')return `<section class="slide"><div class="concept"><div class="concept-copy"><span class="step-no">${s.ey}</span><h1>${s.title}</h1><p>${s.desc}</p></div><div class="rule-stage"><div class="rule-line"><b>소식</b><strong>제품 업데이트·뉴스레터</strong></div><div class="rule-line active"><b>피싱</b><strong>인증·위반·정지·긴급 조치</strong></div><span class="say red">경고와 인증 요구는 메일에서 처리하지 않습니다.</span></div></div></section>`;
  if(s.concept==='decision')return `<section class="slide"><div class="concept"><div class="concept-copy"><span class="step-no">${s.ey}</span><h1>${s.title}</h1><p>${s.desc}</p></div><div class="decision"><div class="decision-row warn"><b class="decision-no">1</b><strong>메일·메시지 닫기</strong><span>답장·링크 금지</span></div><div class="decision-row safe"><b class="decision-no">2</b><strong>Facebook 직접 열기</strong><span>종모양 알림</span></div><div class="decision-row safe"><b class="decision-no">3</b><strong>광고 관리자 직접 열기</strong><span>계정 상태</span></div><div class="decision-row"><b class="decision-no">4</b><strong>같은 경고가 없으면 종료</strong><span>신고·삭제</span></div></div></div></section>`;
  if(s.concept==='rescue')return `<section class="slide"><div class="concept"><div class="concept-copy"><span class="step-no">${s.ey}</span><h1>${s.title}</h1><p>${s.desc}</p></div><div class="rescue"><article><b>1</b><h2>비밀번호 변경</h2><p>계정 센터를 직접 열어 새 비밀번호로 바꿉니다.</p></article><article><b>2</b><h2>2단계 인증</h2><p>인증 앱 또는 안전한 방식으로 보호를 켭니다.</p></article><article><b>3</b><h2>로그인 확인</h2><p>모르는 기기와 세션을 로그아웃하고 관리자에게 알립니다.</p></article></div></div></section>`;
  return `<section class="slide"><div class="final-rule"><span class="step-no">${s.ey}</span><h1>${s.title}</h1><p style="font-size:clamp(25px,1.8vw,34px);color:#dfeaff;margin:2.4vh 0 0">${s.desc}</p><div class="equals"><div>메일·메시지<br>답장 · 링크 · 인증 0회</div><b>=</b><div>Facebook 알림<br>광고 관리자 직접 확인</div></div></div></section>`;
}
const screens={inbox:n=>inboxScreen(n),threat:n=>inboxScreen(n,'threat'),mail:n=>mailScreen(n),bell:n=>facebookNotice(n),ads:n=>adsScreen(n)};
const stage=document.getElementById('stage');stage.innerHTML=scenes.map((s,i)=>s.cover?`<section class="slide${i===0?' active':''}"><div class="hero"><p class="eyebrow">${s.ey}</p><h1>${s.title}</h1><p>${s.desc}</p><div class="hero-route"><span>의심 메시지 닫기</span><i></i><span>종모양 알림</span><i></i><span>광고 관리자</span></div></div></section>`:s.concept?conceptSlide(s):`<section class="slide"><div class="lesson"><div class="lesson-copy"><span class="step-no">${s.ey}</span><h1>${s.title}</h1><p>${s.desc}</p><span class="say${i===3||i===7?' red':''}">${s.say}</span></div><div class="screen-stage">${screens[s.screen](Math.min(i+1,scenes.length-1))}</div></div></section>`).join('');
const slides=[...document.querySelectorAll('.slide')];let index=0;const current=document.getElementById('current'),total=document.getElementById('total'),progress=document.getElementById('progress'),prevButton=document.getElementById('prev'),nextButton=document.getElementById('next');const previousChapter='chapter-05-ad-payment.html#/18',nextChapter='chapter-07-ad-settings.html#/1';total.textContent=String(slides.length).padStart(2,'0');
function show(n){index=Math.max(0,Math.min(slides.length-1,n));slides.forEach((s,i)=>s.classList.toggle('active',i===index));current.textContent=String(index+1).padStart(2,'0');progress.style.width=`${(index+1)/slides.length*100}%`;prevButton.textContent=index===0?'이전 챕터':'이전';nextButton.textContent=index===slides.length-1?'다음 챕터':'다음';history.replaceState(null,'',`#/${index+1}`)}
function move(delta){if(delta<0&&index===0){location.href=previousChapter;return}if(delta>0&&index===slides.length-1){location.href=nextChapter;return}show(index+delta)}
document.addEventListener('click',e=>{const target=e.target.closest('[data-go]');if(target){e.stopPropagation();show(Number(target.dataset.go))}});prevButton.onclick=()=>move(-1);nextButton.onclick=()=>move(1);document.getElementById('replay').onclick=()=>show(0);document.getElementById('full').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen?.();const nextKeys=new Set(['ArrowRight','ArrowDown','PageDown',' ','Enter','MediaTrackNext']),previousKeys=new Set(['ArrowLeft','ArrowUp','PageUp','Backspace','MediaTrackPrevious']);addEventListener('keydown',e=>{if(e.repeat)return;if(nextKeys.has(e.key)){e.preventDefault();move(1);return}if(previousKeys.has(e.key)){e.preventDefault();move(-1);return}if(e.key==='Home')show(0);if(e.key==='End')show(slides.length-1);if(e.key.toLowerCase()==='r')show(index);if(e.key.toLowerCase()==='f')document.getElementById('full').click()});show(Math.max(0,(parseInt(location.hash.split('/')[1],10)||1)-1));
</script>
