<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>비즈액터스쿨 온라인마케팅 교육 · Instagram Reels 올리기</title>
  <link rel="stylesheet" href="./assets/social-publishing-course.css">
</head>
<body data-chapter="02">
<main class="deck">
  <header class="top"><div class="brand"><b>비즈액터스쿨</b><span>온라인마케팅 교육</span></div><div class="chapter">폴라애드 · 02 Instagram Reels</div></header>
  <div class="stage" id="stage"></div>
  <footer class="bottom"><button id="prev">이전</button><button id="next" class="primary">다음</button><button id="replay">다시 보기</button><button id="full">전체 화면</button><div class="counter"><b id="current">1</b> / <span id="total">1</span></div><div class="progress" id="progress"></div></footer>
</main>
<script>
const A='./assets/social-content/';
const target=(html,go,cls='')=>`<button class="${cls} target" data-go="${go}">${html}</button>`;
const phone=(body,dark=false)=>`<div class="phone"><div class="status ${dark?'dark':''}"><span>4:05</span><span>5G&nbsp;&nbsp;88%</span></div><div class="app ${dark?'dark':''}">${body}</div><div class="navline ${dark?'dark':''}"><i></i></div></div>`;
const staticTabs='<div class="bottom-tabs"><span class="tab-icon">⌂</span><span class="tab-icon">⌕</span><span class="tab-icon">＋</span><span class="tab-icon">▣</span><span class="tab-icon avatar"></span></div>';
const home=go=>phone(`<div class="ig-home-head"><b class="ig-word">Instagram</b><div class="home-actions"><span class="line-icon round">♡</span><span class="line-icon">≡</span></div></div><div class="stories"><div class="story"><i></i>내 스토리</div><div class="story"><i></i>브랜딩</div><div class="story"><i></i>마케팅</div></div><div class="feed-user"><span class="avatar"></span><b>polarad_official</b><span class="more">···</span></div><img class="feed-image" src="${A}polarad-post-03.png" alt="폴라애드 게시물"><div class="feed-actions"><span>♡</span><span>○</span><span>▱</span></div><div class="bottom-tabs"><span class="tab-icon">⌂</span><span class="tab-icon">⌕</span>${target('＋',go,'tab-icon')}<span class="tab-icon">▣</span><span class="tab-icon avatar"></span></div>`);
const createMenu=go=>phone(`<div class="ig-home-head"><b class="ig-word">Instagram</b><div class="home-actions"><span class="line-icon round">♡</span><span class="line-icon">≡</span></div></div><div class="stories"><div class="story"><i></i>내 스토리</div><div class="story"><i></i>브랜딩</div></div><div class="feed-user"><span class="avatar"></span><b>polarad_official</b></div><img class="feed-image" src="${A}polarad-post-03.png" alt=""><div class="create-sheet"><div class="sheet-handle"></div><h3>만들기</h3><button class="create-row"><i>▦</i>게시물</button><button class="create-row"><i>◎</i>스토리</button>${target('<i>▶</i>릴스',go,'create-row')}<button class="create-row"><i>◉</i>라이브 방송</button></div>${staticTabs}`);
const reelPicker=go=>phone(`<div class="app-head"><span class="close">×</span>새 릴스<span class="head-action">카메라</span></div><div class="picker-preview" style="height:255px"><img src="${A}reel-frame-01.jpg" alt="릴스 동영상 미리보기"><div class="reel-time">15초</div></div><div class="gallery-head">최근 항목 <span>동영상</span></div><div class="gallery">${[1,2,3,1,2,3].map((n,i)=>i===0?target(`<img src="${A}reel-frame-0${n}.jpg" alt=""><span class="pick-number">15초</span>`,go,'gallery-item'):`<button class="gallery-item"><img src="${A}reel-frame-0${n}.jpg" alt=""></button>`).join('')}</div>`);
const reelEditor=go=>phone(`<div class="reel-stage"><video src="${A}polarad-reel-15s.mp4" muted loop autoplay playsinline></video><div class="app-head dark" style="position:absolute;left:0;right:0;top:0;z-index:3"><span class="close">×</span>새 릴스${target('다음',go,'head-action')}</div><div class="reel-tools"><span class="reel-tool">Aa</span><span class="reel-tool">음악</span><span class="reel-tool">효과</span><span class="reel-tool">자막</span></div><div style="position:absolute;left:12px;right:12px;bottom:15px;display:flex;gap:8px"><button style="height:42px;flex:1;border:0;border-radius:11px;background:rgba(0,0,0,.72);color:#fff;font-weight:900">동영상 편집</button><button style="height:42px;width:88px;border:0;border-radius:11px;background:#fff;color:#111;font-weight:900">다음</button></div></div>`,true);
const timeline=go=>phone(`<div class="edit-screen"><div class="app-head dark"><span class="close">×</span>동영상 편집${target('완료',go,'head-action')}</div><div class="edit-canvas" style="padding:0"><video src="${A}polarad-reel-15s.mp4" muted loop autoplay playsinline style="width:100%;height:100%;object-fit:cover"></video></div><div class="timeline"><div class="timeline-track">${[1,1,2,2,3,3].map(n=>`<img src="${A}reel-frame-0${n}.jpg" alt="">`).join('')}<i class="playhead"></i></div><div class="timeline-label"><span>00:00</span><span>00:15</span></div></div></div>`,true);
const hookScreen=(label,copy,second)=>phone(`<div class="reel-stage"><video src="${A}polarad-reel-15s.mp4" muted loop autoplay playsinline></video><div class="reel-time">00:0${second}</div><div class="reel-hook">${label}<br><span style="font-size:13px;color:#cfe2ff">${copy}</span></div><div class="reel-tools"><span class="reel-tool">♡</span><span class="reel-tool">댓글</span><span class="reel-tool">저장</span></div></div>`,true);
const shareScreen=go=>phone(`<div class="app-head"><span class="back">‹</span>새 릴스</div><div class="share-form"><div class="share-top"><img class="share-thumb" src="${A}reel-frame-01.jpg" alt=""><div class="caption-box"><b>polarad_official</b><br>브랜드 마케팅은 기준부터 시작합니다.<br><br>#폴라애드 #브랜드마케팅</div></div>${target('커버 편집',go,'setting-row')}<div class="setting-row">사람 태그하기<span>선택</span></div><div class="setting-row">위치 추가<span>선택</span></div><div class="setting-row">Facebook에도 공유<span>선택</span></div><div class="setting-row">고급 설정<span>확인</span></div></div><button class="share-button">공유</button>`);
const coverEditor=go=>phone(`<div class="cover-editor"><div class="cover-main"><div class="cover-preview"><img src="${A}reel-frame-02.jpg" alt="릴스 커버"><div class="cover-safe"></div></div></div><div class="cover-strip">${[1,2,3,2,1].map((n,i)=>i===1?target(`<img class="selected" src="${A}reel-frame-0${n}.jpg" alt="">`,go,''):`<img src="${A}reel-frame-0${n}.jpg" alt="">`).join('')}</div></div>`,true);
const finalShare=go=>phone(`<div class="app-head"><span class="back">‹</span>새 릴스</div><div class="share-form"><div class="share-top"><img class="share-thumb" src="${A}reel-frame-02.jpg" alt=""><div class="caption-box"><b>polarad_official</b><br>브랜드 마케팅은 기준부터 시작합니다.<br><br>#폴라애드 #브랜드마케팅</div></div><div class="setting-row">커버<span>설정 완료</span></div><div class="setting-row">프로필 그리드에 표시<span>켜짐</span></div><div class="setting-row">Facebook에도 공유<span>선택</span></div><div class="setting-row">고급 설정<span>확인</span></div></div>${target('공유',go,'share-button')}`);
const scenes=[
  {cover:1,ey:'CONTENT COURSE · 02',title:'Instagram<br><em>Reels 올리기</em>',desc:'15초 폴라애드 영상을 실제 Reels 게시 화면에 맞춰 올립니다.'},
  {concept:'ratio',ey:'REELS SIZE',title:'화면을 꽉 채우는<br><em>9:16 세로 영상</em>',desc:'1080 × 1920 픽셀로 만들면 스마트폰 전체 화면에 맞습니다.'},
  {concept:'time',ey:'COURSE STANDARD',title:'권장 길이는<br><em>15초부터 45초</em>',desc:'플랫폼의 업로드 한도가 아니라 교육에서 권장하는 사업 홍보 영상 길이입니다.'},
  {ey:'CONTENT RULE 01',title:'첫 3초에<br><em>멈출 이유</em>',desc:'문제, 질문, 결과처럼 바로 이해되는 문장으로 시선을 붙잡습니다.',say:'3초 후킹 실패 시 이탈',screen:()=>hookScreen('광고대행사, 무엇부터 비교할까요?','질문으로 시선 정지',3)},
  {ey:'CONTENT RULE 02',title:'첫 5초 안에<br><em>핵심 내용</em>',desc:'누구를 위한 내용인지, 무엇을 알려주는지 바로 보여줍니다.',say:'서론보다 핵심 먼저',screen:()=>hookScreen('금액보다 먼저, 업무 범위','핵심 기준을 5초 안에',5)},
  {ey:'STEP 01',title:'하단 가운데<br><em>＋ 버튼</em>',desc:'Instagram 홈 화면에서 만들기 버튼을 누릅니다.',say:'스마트폰 Instagram 앱',screen:()=>home(6)},
  {ey:'STEP 02',title:'만들기에서<br><em>릴스</em>',desc:'게시물이나 스토리가 아니라 릴스를 선택합니다.',say:'릴스 선택',screen:()=>createMenu(7)},
  {ey:'STEP 03',title:'앨범에서<br><em>세로 영상 선택</em>',desc:'9:16으로 제작한 폴라애드 15초 영상을 고릅니다.',say:'1080 × 1920 · 15초',screen:()=>reelPicker(8)},
  {ey:'STEP 04',title:'미리보고<br><em>다음</em>',desc:'영상이 세로 화면을 채우는지 확인하고 편집 단계로 갑니다.',say:'잘림 여부 확인',screen:()=>reelEditor(9)},
  {ey:'STEP 05',title:'타임라인에서<br><em>첫 3초 확인</em>',desc:'첫 문장이 늦게 나오거나 빈 화면이 길면 앞부분을 줄입니다.',say:'00:00부터 바로 시작',screen:()=>timeline(10)},
  {ey:'STEP 06',title:'공유 화면에서<br><em>커버 편집</em>',desc:'프로필 그리드에 보일 대표 화면을 따로 선택합니다.',say:'첫 화면과 커버는 다를 수 있음',screen:()=>shareScreen(11)},
  {ey:'STEP 07',title:'글자가 보이는<br><em>커버 장면 선택</em>',desc:'프로필에서 잘리지 않도록 핵심 글자가 가운데에 있는 장면을 고릅니다.',say:'9:16 안의 중앙 안전 영역',screen:()=>coverEditor(12)},
  {ey:'STEP 08',title:'본문 확인 후<br><em>공유</em>',desc:'커버와 프로필 그리드 표시를 확인하고 릴스를 게시합니다.',say:'공유 전 마지막 확인',screen:()=>finalShare(13)},
  {ey:'COMPLETE',title:'Reels 업로드<br><em>완료</em>',desc:'9:16 · 15초 · 3초 후킹 · 5초 핵심 · 커버까지 확인했습니다.',say:'다음 챕터 · Threads',screen:()=>phone('<div class="complete"><div class="complete-mark">✓</div><h2>Reels 업로드 완료</h2><p>9:16 · 1080 × 1920<br>교육 권장 15초부터 45초</p></div>')}
];
const stage=document.querySelector('#stage');
stage.innerHTML=scenes.map(s=>s.cover?`<section class="slide"><div class="hero"><p class="eyebrow">${s.ey}</p><h1>${s.title}</h1><p>${s.desc}</p><div class="device-rule"><b>모바일 작업</b><span>스마트폰 세로 화면</span></div></div></section>`:s.concept==='ratio'?`<section class="slide"><div class="concept"><p class="eyebrow">${s.ey}</p><h1>${s.title}</h1><p>${s.desc}</p><div class="concept-grid" style="grid-template-columns:1fr"><div class="ratio-card current" style="max-width:740px"><div class="ratio-shape r916"></div><div><b>9:16</b><strong>1080 × 1920</strong><span>Reels · Story 전체 화면</span></div></div></div></div></section>`:s.concept==='time'?`<section class="slide"><div class="concept"><p class="eyebrow">${s.ey}</p><h1>${s.title}</h1><p>${s.desc}</p><div class="device-rule"><b>15초</b><span>빠른 핵심 전달</span><b>30초</b><span>설명형</span><b>45초</b><span>사례형</span></div></div></section>`:`<section class="slide"><div class="lesson"><div class="lesson-copy"><span class="step-no">${s.ey}</span><h1>${s.title}</h1><p>${s.desc}</p><span class="say">${s.say}</span></div><div class="phone-stage">${s.screen()}</div></div></section>`).join('');
</script>
<script src="./assets/social-publishing-course.js"></script>
</body>
</html>
