<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="robots" content="noindex,nofollow,noarchive" />
    <title>AI 자동화 과정 안내 · 비즈액터스쿨 수료생</title>
    <meta
      name="description"
      content="비즈액터스쿨 수료생 대상 AI 자동화 기본과정(4시간)과 고급과정(10시간)의 내용과 진행 방식을 안내합니다."
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="AI 자동화 기본과정 · 고급과정 안내" />
    <meta
      property="og:description"
      content="비즈액터스쿨 수료생 대상 별도 과정입니다. 기본과정 4시간, 고급과정 2시간 × 5회."
    />
    <meta
      property="og:image"
      content="https://www.polaai.co.kr/ai-automation/assets/og.jpg"
    />
    <meta name="theme-color" content="#100c33" />
    <style>
      @font-face {
        font-family: Pretendard;
        src: url("../samples/funding-hero-assets/PretendardVariable.woff2")
          format("woff2");
        font-weight: 100 900;
        font-display: swap;
      }
      :root {
        --deep: #100c33;
        --sky: #c9b8ff;
        --ai: #a78bfa;
        --violet: #5b3ee0;
        --ink: #17123a;
        --muted: #5f5a7a;
        --good: #4ce3aa;
        --warn: #ffb22e;
        --kakao: #fee500;
        font-family:
          Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", system-ui,
          sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      body {
        background: var(--deep);
        color: #fff;
        word-break: keep-all;
        -webkit-font-smoothing: antialiased;
      }
      button,
      a {
        font: inherit;
      }
      h1,
      h2,
      h3,
      p,
      ul {
        margin: 0;
      }
      ul {
        padding: 0;
        list-style: none;
      }

      /* deck */
      .deck {
        position: relative;
        width: 100vw;
        height: 100vh;
        height: 100dvh;
        min-height: 640px;
        padding: 4.2vh 7vw;
        display: grid;
        grid-template-rows: 7vh minmax(0, 1fr) 8vh;
        overflow: hidden;
        background: var(--deep);
      }
      .deck:before {
        content: "";
        position: absolute;
        inset: 0;
        background:
          linear-gradient(
            105deg,
            rgba(8, 10, 40, 0.985),
            rgba(42, 26, 110, 0.93) 54%,
            rgba(96, 64, 220, 0.78)
          ),
          url("./assets/bg.jpg") center/cover;
      }
      .deck:after {
        content: "";
        position: absolute;
        inset: 0;
        background-image: radial-gradient(
          circle at 20% 30%,
          rgba(255, 255, 255, 0.15) 0 1px,
          transparent 1px
        );
        background-size: 12px 12px;
        mix-blend-mode: overlay;
        pointer-events: none;
      }
      .top,
      .stage,
      .bottom {
        position: relative;
        z-index: 2;
      }
      .top {
        display: flex;
        align-items: center;
        border-bottom: 1px solid rgba(255, 255, 255, 0.24);
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 16px;
        font-size: clamp(16px, 1.12vw, 22px);
        font-weight: 800;
      }
      .brand span {
        padding-left: 16px;
        border-left: 1px solid rgba(255, 255, 255, 0.34);
        font-weight: 600;
        color: #e2dcff;
      }
      .top .label {
        margin-left: auto;
        font-size: clamp(14px, 1vw, 19px);
        font-weight: 750;
        color: #e2dcff;
      }
      .stage {
        min-height: 0;
        overflow: hidden;
      }
      .slide {
        display: none;
        width: 100%;
        height: 100%;
        padding: 2.4vh 0 1.2vh;
        overflow: hidden;
      }
      .slide.active {
        display: flex;
        animation: slideIn 0.46s cubic-bezier(0.2, 0.8, 0.2, 1) both;
      }
      .slide.active .lesson-copy {
        animation: copyEnter 0.72s cubic-bezier(0.18, 0.8, 0.24, 1) both;
      }
      .slide.active .reveal {
        animation: revealUp 0.6s cubic-bezier(0.18, 0.8, 0.24, 1) both;
      }
      .slide.active .reveal:nth-child(2) {
        animation-delay: 0.08s;
      }
      .slide.active .reveal:nth-child(3) {
        animation-delay: 0.16s;
      }
      .slide.active .reveal:nth-child(4) {
        animation-delay: 0.24s;
      }
      .slide.active .reveal:nth-child(5) {
        animation-delay: 0.32s;
      }
      .slide.active .reveal:nth-child(6) {
        animation-delay: 0.4s;
      }
      @keyframes slideIn {
        from {
          opacity: 0;
          transform: scale(0.985);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      @keyframes copyEnter {
        from {
          opacity: 0;
          transform: translateX(-32px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      @keyframes revealUp {
        from {
          opacity: 0;
          transform: translateY(18px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      .bottom {
        display: flex;
        align-items: center;
        gap: 10px;
        border-top: 1px solid rgba(255, 255, 255, 0.24);
      }
      .bottom button,
      .bottom a {
        height: 46px;
        display: inline-flex;
        align-items: center;
        padding: 0 20px;
        border: 1px solid rgba(255, 255, 255, 0.4);
        border-radius: 10px;
        background: rgba(255, 255, 255, 0.08);
        color: #fff;
        font-size: 17px;
        font-weight: 800;
        text-decoration: none;
        cursor: pointer;
      }
      .bottom .primary {
        background: #fff;
        color: #3b1fa8;
        border-color: #fff;
      }
      .bottom .kakao {
        background: var(--kakao);
        color: #191600;
        border-color: var(--kakao);
      }
      .bottom button:focus-visible,
      .bottom a:focus-visible,
      .cta:focus-visible {
        outline: 3px solid #fff;
        outline-offset: 3px;
      }
      .counter {
        margin-left: auto;
        font-size: 18px;
        font-weight: 800;
        color: #e2dcff;
      }
      .counter b {
        color: #fff;
      }
      .progress {
        position: absolute;
        left: 0;
        bottom: -1px;
        height: 4px;
        background: var(--ai);
        border-radius: 4px;
        transition: width 0.3s;
      }
      .mobile-cta {
        display: none;
      }

      /* cover · closing */
      .hero {
        margin: auto 0;
        max-width: 1460px;
      }
      .eyebrow,
      .step-no {
        display: block;
        font-size: clamp(15px, 1.08vw, 21px);
        font-weight: 900;
        letter-spacing: 0.12em;
        color: var(--sky);
        margin: 0 0 1.6vh;
      }
      .hero h1 {
        font-size: clamp(60px, 6.2vw, 124px);
        line-height: 0.94;
        letter-spacing: -0.07em;
      }
      .hero h1 em,
      .lesson h1 em,
      .closing h1 em {
        font-style: normal;
        color: var(--sky);
      }
      .hero p {
        font-size: clamp(22px, 1.8vw, 36px);
        line-height: 1.4;
        color: #ebe6ff;
        margin-top: 3vh;
        max-width: 30em;
      }
      .route {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 13px;
        margin-top: 4vh;
      }
      .route span {
        padding: 12px 20px;
        border: 1px solid #ffffff55;
        border-radius: 999px;
        font-size: clamp(17px, 1.2vw, 24px);
        font-weight: 850;
      }
      .route i {
        width: 34px;
        height: 4px;
        border-radius: 5px;
        background: var(--sky);
      }
      .closing {
        margin: auto;
        width: 100%;
        text-align: center;
      }
      .closing h1 {
        font-size: clamp(56px, 5.4vw, 104px);
        line-height: 0.95;
        letter-spacing: -0.07em;
      }
      .closing p {
        font-size: clamp(20px, 1.6vw, 31px);
        line-height: 1.45;
        color: #ebe6ff;
        margin: 3vh auto 0;
        max-width: 30em;
      }
      .cta {
        display: inline-flex;
        align-items: center;
        gap: 12px;
        margin-top: 4.4vh;
        padding: 20px 34px;
        border-radius: 16px;
        background: var(--kakao);
        color: #191600;
        font-size: clamp(19px, 1.4vw, 26px);
        font-weight: 900;
        text-decoration: none;
        box-shadow: 0 18px 40px #0005;
      }
      .cta:after {
        content: "→";
      }
      .closing .route {
        justify-content: center;
        margin-top: 3.2vh;
      }

      /* lesson */
      .lesson {
        width: 100%;
        height: 100%;
        display: grid;
        grid-template-columns: minmax(350px, 0.7fr) minmax(0, 1.3fr);
        gap: 3.6vw;
        align-items: center;
      }
      .lesson-copy {
        min-width: 0;
      }
      .lesson h1 {
        font-size: clamp(40px, 3.5vw, 70px);
        line-height: 1.02;
        letter-spacing: -0.062em;
        text-wrap: balance;
      }
      .lesson-copy > p {
        font-size: clamp(18px, 1.32vw, 26px);
        line-height: 1.48;
        color: #ebe6ff;
        margin-top: 2.2vh;
        max-width: 24em;
        text-wrap: pretty;
      }
      .mode {
        display: inline-flex;
        align-items: center;
        margin-top: 2.6vh;
        padding: 11px 16px;
        border-left: 5px solid var(--sky);
        background: rgba(255, 255, 255, 0.09);
        font-size: clamp(16px, 1.12vw, 22px);
        font-weight: 900;
      }
      .mode.good {
        border-color: var(--good);
        color: #d6fff0;
      }
      .mode.warn {
        border-color: var(--warn);
        color: #fff1d6;
      }
      .visual {
        min-width: 0;
      }
      .note {
        margin-top: 1.6vh;
        padding: 12px 16px;
        border-radius: 12px;
        background: #ffffff12;
        border: 1px solid #ffffff2e;
        font-size: clamp(15px, 1vw, 19px);
        line-height: 1.45;
        color: #ebe6ff;
      }

      /* compare */
      .compare {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 18px;
      }
      .scope {
        min-height: clamp(220px, 30vh, 320px);
        padding: 3.2vh 2vw;
        border-radius: 20px;
        background: #fff;
        color: var(--ink);
        border-top: 7px solid #9b86ff;
        box-shadow: 0 24px 60px #05031a55;
      }
      .scope.alt {
        border-top-color: var(--good);
      }
      .scope small {
        display: block;
        font-size: clamp(13px, 0.9vw, 16px);
        font-weight: 800;
        color: var(--muted);
      }
      .scope h2 {
        margin-top: 1vh;
        font-size: clamp(25px, 2vw, 38px);
        letter-spacing: -0.05em;
      }
      .scope ul {
        display: grid;
        gap: 1.3vh;
        margin-top: 2.6vh;
      }
      .scope li {
        padding-left: 16px;
        border-left: 4px solid #d9d0ff;
        font-size: clamp(16px, 1.12vw, 21px);
        font-weight: 750;
        line-height: 1.35;
      }
      .scope.alt li {
        border-left-color: #bff3df;
      }

      /* courses */
      .courses {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 18px;
      }
      .course {
        display: flex;
        flex-direction: column;
        padding: 3.2vh 2vw;
        border-radius: 20px;
        background: #fff;
        color: var(--ink);
        border: 2px solid #b9a8ff;
        box-shadow: 0 24px 60px #05031a55;
      }
      .course.adv {
        border-color: #4ce3aa;
      }
      .course .tag {
        align-self: flex-start;
        padding: 5px 11px;
        border-radius: 999px;
        background: #efeaff;
        color: var(--violet);
        font-size: clamp(12px, 0.82vw, 15px);
        font-weight: 900;
        letter-spacing: 0.08em;
      }
      .course.adv .tag {
        background: #dcfaee;
        color: #0d7a55;
      }
      .course h2 {
        margin-top: 1.6vh;
        font-size: clamp(25px, 1.95vw, 37px);
        letter-spacing: -0.05em;
      }
      .course .meta {
        margin-top: 0.8vh;
        font-size: clamp(15px, 1.02vw, 19px);
        font-weight: 800;
        color: var(--muted);
      }
      .course p {
        margin-top: 2vh;
        font-size: clamp(16px, 1.1vw, 21px);
        line-height: 1.45;
        font-weight: 650;
      }
      .course strong {
        margin-top: auto;
        padding-top: 3vh;
        font-size: clamp(36px, 3vw, 58px);
        letter-spacing: -0.05em;
        color: var(--violet);
      }
      .course.adv strong {
        color: #0d7a55;
      }
      .course-bar {
        grid-column: 1/-1;
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 2vh 1.8vw;
        border-radius: 16px;
        background: #1c1450;
        border: 1px solid #ffffff2a;
        font-size: clamp(15px, 1.05vw, 20px);
        font-weight: 800;
      }
      .course-bar b {
        font-size: clamp(17px, 1.25vw, 24px);
      }

      /* channels */
      .channels {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 16px;
      }
      .channel {
        padding: 3vh 1.6vw;
        border-radius: 20px;
        border: 1px solid #ffffff40;
        background: #ffffff10;
      }
      .channel .logo {
        width: clamp(64px, 5vw, 88px);
        height: clamp(64px, 5vw, 88px);
        display: grid;
        place-items: center;
        border-radius: 18px;
        background: #fff;
      }
      .channel .logo img {
        width: 62%;
        height: 62%;
        object-fit: contain;
      }
      .channel .logo.wide img {
        width: 78%;
      }
      .channel strong {
        display: block;
        margin-top: 2.4vh;
        font-size: clamp(22px, 1.6vw, 31px);
        letter-spacing: -0.04em;
      }
      .channel span {
        display: block;
        margin-top: 1vh;
        font-size: clamp(15px, 1.05vw, 20px);
        line-height: 1.45;
        color: #e3ddff;
      }

      /* flow */
      .flow {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 14px;
      }
      .flow-step {
        position: relative;
        padding: 2.8vh 1.3vw;
        border-radius: 18px;
        border: 1px solid #ffffff40;
        background: #ffffff10;
        min-height: clamp(150px, 20vh, 200px);
      }
      .flow-step:not(:last-child):after {
        content: "";
        position: absolute;
        top: 50%;
        right: -14px;
        width: 14px;
        height: 3px;
        background: var(--sky);
      }
      .flow-step small {
        font-size: clamp(12px, 0.82vw, 15px);
        font-weight: 900;
        letter-spacing: 0.1em;
        color: var(--sky);
      }
      .flow-step strong {
        display: block;
        margin-top: 1.4vh;
        font-size: clamp(20px, 1.45vw, 28px);
        letter-spacing: -0.04em;
        line-height: 1.15;
      }
      .flow-step span {
        display: block;
        margin-top: 1.2vh;
        font-size: clamp(14px, 0.98vw, 18px);
        line-height: 1.45;
        color: #e3ddff;
      }

      /* support */
      .support {
        display: grid;
        grid-template-columns: 0.8fr 1.2fr;
        gap: 2vw;
        align-items: center;
        padding: 4vh 2.2vw;
        border-radius: 24px;
        background: #fff;
        color: var(--ink);
        box-shadow: 0 24px 60px #05031a55;
      }
      .support .num {
        font-size: clamp(110px, 10vw, 200px);
        font-weight: 950;
        line-height: 0.8;
        letter-spacing: -0.06em;
        color: var(--violet);
      }
      .support .num-label {
        margin-top: 2vh;
        font-size: clamp(20px, 1.5vw, 29px);
        font-weight: 900;
        letter-spacing: -0.03em;
      }
      .support ul {
        display: grid;
        gap: 12px;
      }
      .support li {
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 2vh 1.2vw;
        border: 1px solid #e4def9;
        border-radius: 16px;
        background: #f7f5ff;
        font-size: clamp(17px, 1.2vw, 23px);
        font-weight: 800;
      }
      .support li b {
        flex: none;
        display: grid;
        place-items: center;
        width: 44px;
        height: 44px;
        border-radius: 12px;
        background: var(--violet);
        color: #fff;
        font-size: 17px;
      }

      /* telegram */
      .assistant {
        display: grid;
        grid-template-columns: minmax(0, 0.95fr) minmax(0, 1.05fr);
        gap: 2.2vw;
        align-items: center;
      }
      .phone {
        position: relative;
        width: min(100%, 360px);
        margin: 0 auto;
        padding: 12px;
        border-radius: 38px;
        background: #0b0a1c;
        border: 1px solid #ffffff38;
        box-shadow: 0 30px 70px #05031a88;
      }
      .phone-screen {
        overflow: hidden;
        border-radius: 28px;
        background: #dfe9f2;
      }
      .tg-head {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 12px 14px;
        background: #fff;
        color: #111;
        border-bottom: 1px solid #d6dee6;
      }
      .tg-avatar {
        flex: none;
        display: grid;
        place-items: center;
        width: 36px;
        height: 36px;
        border-radius: 50%;
        background: linear-gradient(140deg, #8b6cff, #5b3ee0);
        color: #fff;
        font-size: 13px;
        font-weight: 900;
      }
      .tg-head b {
        display: block;
        font-size: 15px;
      }
      .tg-head small {
        display: block;
        font-size: 12px;
        color: #6b7785;
      }
      .tg-chat {
        display: grid;
        gap: 8px;
        padding: 12px 10px 14px;
      }
      .msg {
        max-width: 84%;
        padding: 9px 11px;
        border-radius: 14px;
        font-size: clamp(12.5px, 0.86vw, 14.5px);
        line-height: 1.42;
        color: #111;
        background: #fff;
        box-shadow: 0 1px 1px #0001;
      }
      .msg.me {
        justify-self: end;
        background: #e1f7cd;
        border-bottom-right-radius: 4px;
      }
      .msg.bot {
        justify-self: start;
        border-bottom-left-radius: 4px;
      }
      .photos {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 4px;
        margin-bottom: 6px;
      }
      .photos i {
        height: clamp(34px, 5vh, 52px);
        border-radius: 8px;
        background: linear-gradient(135deg, #c9b38f, #7d6a52);
      }
      .photos i + i {
        background: linear-gradient(135deg, #a7b8c8, #57697b);
      }
      .preview {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 4px;
        margin-top: 7px;
      }
      .preview i {
        height: clamp(44px, 7vh, 76px);
        border-radius: 6px;
        background: linear-gradient(160deg, #8b6cff, #3b1fa8);
      }
      .preview i:nth-child(2) {
        background: linear-gradient(160deg, #f2f0ff, #c9b8ff);
      }
      .preview i:nth-child(3) {
        background: linear-gradient(160deg, #4ce3aa, #167a5a);
      }
      .preview i:nth-child(4) {
        background: linear-gradient(160deg, #ffd37a, #e0901a);
      }
      .tg-buttons {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 5px;
        margin-top: 6px;
      }
      .tg-buttons span {
        padding: 7px 0;
        border-radius: 9px;
        background: #3d8fd6;
        color: #fff;
        text-align: center;
        font-size: 12.5px;
        font-weight: 800;
      }
      .tg-buttons span + span {
        background: #7f93a6;
      }
      .phone-note {
        margin-top: 10px;
        text-align: center;
        font-size: 13px;
        font-weight: 700;
        color: #cfc6ff;
      }
      .feature-list {
        display: grid;
        gap: 12px;
      }
      .feature {
        display: grid;
        grid-template-columns: 48px 1fr;
        gap: 14px;
        align-items: start;
        padding: 2.2vh 1.3vw;
        border-radius: 18px;
        border: 1px solid #ffffff40;
        background: #ffffff10;
      }
      .feature b {
        display: grid;
        place-items: center;
        width: 48px;
        height: 48px;
        border-radius: 14px;
        background: #ffffff1c;
        color: var(--sky);
        font-size: 18px;
        font-weight: 900;
      }
      .feature strong {
        display: block;
        font-size: clamp(18px, 1.3vw, 25px);
        letter-spacing: -0.03em;
      }
      .feature span {
        display: block;
        margin-top: 0.6vh;
        font-size: clamp(14px, 0.98vw, 18px);
        line-height: 1.45;
        color: #e3ddff;
      }

      /* pipeline */
      .pipeline {
        display: grid;
        gap: 16px;
      }
      .pipe-steps {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 16px;
      }
      .pipe-step {
        position: relative;
        padding: 3vh 1.5vw;
        border-radius: 20px;
        background: #fff;
        color: var(--ink);
        box-shadow: 0 24px 60px #05031a55;
      }
      .pipe-step:nth-child(1) {
        z-index: 3;
      }
      .pipe-step:nth-child(2) {
        z-index: 2;
      }
      .pipe-step:not(:last-child):after {
        content: "→";
        position: absolute;
        top: 50%;
        right: -8px;
        transform: translate(50%, -50%);
        z-index: 2;
        display: grid;
        place-items: center;
        width: 34px;
        height: 34px;
        border-radius: 50%;
        background: var(--violet);
        color: #fff;
        font-size: 17px;
        font-weight: 900;
      }
      .pipe-step small {
        font-size: clamp(12px, 0.82vw, 15px);
        font-weight: 900;
        letter-spacing: 0.1em;
        color: var(--violet);
      }
      .pipe-step strong {
        display: block;
        margin-top: 1.2vh;
        font-size: clamp(24px, 1.85vw, 35px);
        letter-spacing: -0.05em;
      }
      .pipe-step span {
        display: block;
        margin-top: 1.2vh;
        font-size: clamp(15px, 1.05vw, 20px);
        line-height: 1.45;
        font-weight: 650;
        color: #3a3556;
      }
      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }
      .chips span {
        padding: 10px 16px;
        border-radius: 999px;
        border: 1px solid #ffffff4a;
        background: #ffffff12;
        font-size: clamp(15px, 1.05vw, 20px);
        font-weight: 850;
      }

      /* checklist */
      .checklist {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
      }
      .check {
        display: grid;
        grid-template-columns: 44px 1fr;
        gap: 14px;
        align-items: start;
        padding: 2.2vh 1.2vw;
        border-radius: 18px;
        border: 1px solid #ffffff40;
        background: #ffffff10;
      }
      .check b {
        display: grid;
        place-items: center;
        width: 44px;
        height: 44px;
        border-radius: 12px;
        background: #4ce3aa26;
        color: #9ff0cf;
        font-size: 20px;
        font-weight: 900;
      }
      .check strong {
        display: block;
        font-size: clamp(18px, 1.3vw, 25px);
        letter-spacing: -0.03em;
      }
      .check span {
        display: block;
        margin-top: 0.6vh;
        font-size: clamp(14px, 0.98vw, 18px);
        line-height: 1.45;
        color: #e3ddff;

      /* steps */
      .steps {
        display: grid;
        gap: 12px;
      }
      .step {
        display: grid;
        grid-template-columns: 62px 1fr;
        gap: 18px;
        align-items: center;
        padding: 2.2vh 1.4vw;
        border-radius: 18px;
        background: #fff;
        color: var(--ink);
        box-shadow: 0 18px 44px #05031a44;

      .step b {
        display: grid;
        place-items: center;
        width: 62px;
        height: 62px;
        border-radius: 16px;
        background: var(--violet);
        color: #fff;
        font-size: 22px;
        font-weight: 900;

      .step strong {

        font-size: clamp(19px, 1.4vw, 27px);
        letter-spacing: -0.04em;
      }
      .step span {
        display: block;
        margin-top: 0.5vh;
        font-size: clamp(15px, 1.02vw, 19px);
        line-height: 1.4;
        font-weight: 650;
        color: #4a4566;
      }

      /* sessions */
      .sessions {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 12px;
      }
      .session {
        position: relative;

        border-radius: 18px;
        border: 1px solid #ffffff40;
        background: #ffffff10;

      .session small {

        font-size: clamp(15px, 1.02vw, 19px);

      .session-bar {
        margin-top: 14px;
        height: 6px;

        background: #fff;
        color: var(--ink);
        box-shadow: 0 24px 60px #05031a55;

      .cost {
        display: grid;
        grid-template-columns: 1fr 1.4fr auto;
        gap: 1.6vw;
        align-items: center;
        padding: 2.6vh 0;
        border-bottom: 1px solid #e7e2f8;
      }
      .cost:last-of-type {
        border-bottom: 0;

      .cost strong {
        font-size: clamp(21px, 1.6vw, 31px);
        letter-spacing: -0.04em;
      }
      .cost span {
        font-size: clamp(15px, 1.05vw, 20px);

        color: var(--muted);
      }
      .cost b {

        const fromHash = () =>
          Math.max(
            0,
            Math.min(
              slides.length - 1,
              (parseInt(location.hash.replace(/\D/g, ""), 10) || 1) - 1,
            ),
          );
        let index = fromHash();
        total.textContent = String(slides.length).padStart(2, "0");
        const show = (value, push) => {
          index = Math.max(0, Math.min(slides.length - 1, value));
          slides.forEach((s, i) => s.classList.toggle("active", i === index));
          current.textContent = String(index + 1).padStart(2, "0");
          progress.style.width = `${((index + 1) / slides.length) * 100}%`;
          prev.disabled = index === 0;
          next.textContent = index === slides.length - 1 ? "처음으로" : "다음";
          const hash = `#/${index + 1}`;
          if (location.hash !== hash)
            (push ? history.pushState : history.replaceState).call(
              history,
              null,
              "",
              hash,
            );
        };
        const move = (d) => {
          if (d > 0 && index === slides.length - 1) {
            show(0, true);
            return;
          }
          show(index + d, true);
        };
        prev.addEventListener("click", () => move(-1));
        next.addEventListener("click", () => move(1));
        full.addEventListener("click", () =>
          document.fullscreenElement
            ? document.exitFullscreen?.()
            : document.documentElement.requestFullscreen?.(),
        );
        const nextKeys = new Set([
          "ArrowRight",
          "ArrowDown",
          "PageDown",
          " ",
          "Enter",
        ]);
        const prevKeys = new Set([
          "ArrowLeft",
          "ArrowUp",
          "PageUp",
          "Backspace",
        ]);
        document.addEventListener("keydown", (e) => {
          if (scroller.matches || e.altKey || e.ctrlKey || e.metaKey) return;
          if (
            (e.key === " " || e.key === "Enter") &&
            e.target instanceof Element &&
            e.target.closest("a,button")
          )
            return;
          if (nextKeys.has(e.key)) {
            e.preventDefault();
            move(1);
            return;
          }
          if (prevKeys.has(e.key)) {
            e.preventDefault();
            move(-1);
            return;
          }
          if (e.key === "Home") show(0, true);
          if (e.key === "End") show(slides.length - 1, true);
          if (e.key.toLowerCase() === "f") full.click();
        });
        addEventListener("popstate", () => show(fromHash(), false));
        show(index, false);
        if (scroller.matches && location.hash) slides[index].scrollIntoView();
      })();
    </script>
  </body>
</html>
