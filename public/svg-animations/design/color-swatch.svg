<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <style>
    .sw1 { animation: sw1 2s ease-in-out infinite; }
    .sw2 { animation: sw2 2s ease-in-out infinite; }
    .sw3 { animation: sw3 2s ease-in-out infinite; }

    @keyframes sw1 { 0%,20%,100% { transform: translateX(0); } 40%,60% { transform: translateX(-2px); } }
    @keyframes sw2 { 0%,20%,100% { transform: translateX(0); } 40%,60% { transform: translateY(-2px); } }
    @keyframes sw3 { 0%,20%,100% { transform: translateX(0); } 40%,60% { transform: translateX(2px); } }

    circle { transform-origin: center; transform-box: fill-box; }
  </style>
  <circle class="sw1" cx="8.5" cy="13.3" r="3" />
  <circle class="sw2" cx="12" cy="11.2" r="3" />
  <circle class="sw3" cx="15.5" cy="13.3" r="3" />
</svg>
