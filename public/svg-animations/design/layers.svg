<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <style>
    .ly-top {
      stroke-dasharray: 40;
      stroke-dashoffset: 40;
      animation: drawTop 4s cubic-bezier(0.22, 1, 0.36, 1) infinite;
    }
    .ly-mid {
      stroke-dasharray: 40;
      stroke-dashoffset: 40;
      animation: drawMid 4s cubic-bezier(0.22, 1, 0.36, 1) infinite;
    }
    .ly-bot {
      stroke-dasharray: 40;
      stroke-dashoffset: 40;
      animation: drawBot 4s cubic-bezier(0.22, 1, 0.36, 1) infinite;
    }
    .ly-top-g {
      animation: liftTop 4s cubic-bezier(0.34, 1.56, 0.64, 1) infinite;
      transform-origin: 12px 7px;
    }
    .ly-mid-g {
      animation: liftMid 4s cubic-bezier(0.34, 1.56, 0.64, 1) infinite;
      transform-origin: 12px 12px;
    }
    .ly-bot-g {
      animation: liftBot 4s cubic-bezier(0.34, 1.56, 0.64, 1) infinite;
      transform-origin: 12px 17px;
    }
    @keyframes drawTop {
      0% { stroke-dashoffset: 40; }
      18% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes drawMid {
      0%, 8% { stroke-dashoffset: 40; }
      26% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes drawBot {
      0%, 16% { stroke-dashoffset: 40; }
      34% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes liftTop {
      0%, 35% { transform: translateY(0px) scale(1); opacity: 1; }
      48% { transform: translateY(-4px) scale(1.03); opacity: 1; }
      55% { transform: translateY(-5px) scale(1.02); }
      70% { transform: translateY(-4.5px) scale(1.02); }
      82% { transform: translateY(0px) scale(1); }
      88% { transform: translateY(0.5px); }
      93%, 100% { transform: translateY(0px) scale(1); }
    }
    @keyframes liftMid {
      0%, 38% { transform: translateY(0px) scale(1); opacity: 0.9; }
      50% { transform: translateY(0px) scale(1.01); opacity: 1; }
      55% { transform: translateY(0px) scale(1); }
      70% { transform: translateY(0px); }
      82%, 100% { transform: translateY(0px) scale(1); opacity: 0.9; }
    }
    @keyframes liftBot {
      0%, 40% { transform: translateY(0px) scale(1); opacity: 0.8; }
      52% { transform: translateY(4px) scale(1.03); opacity: 1; }
      60% { transform: translateY(5px) scale(1.02); }
      72% { transform: translateY(4.5px) scale(1.02); }
      84% { transform: translateY(0px) scale(1); }
      90% { transform: translateY(-0.5px); }
      95%, 100% { transform: translateY(0px) scale(1); opacity: 0.8; }
    }
  </style>
  <g class="ly-top-g">
    <polygon class="ly-top" points="12,2 22,7 12,12 2,7" />
  </g>
  <g class="ly-mid-g">
    <polygon class="ly-mid" points="2,12 12,17 22,12" />
  </g>
  <g class="ly-bot-g">
    <polygon class="ly-bot" points="2,17 12,22 22,17" />
  </g>
</svg>
