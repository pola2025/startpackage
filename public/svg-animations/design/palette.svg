  <path class="palette-body" d="M12.2 4.2L11 8M9.8 10.8l-4.9-2.2"/>
  <circle class="drop drop1" cx="9.1" cy="9.3" r="1.05" />
  <circle class="drop drop2" cx="12.1" cy="7.7" r="1.05" />
  <circle class="drop drop3" cx="14.9" cy="9.4" r="1.05" />
</svg>
