<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <style>
    .palette-body { stroke-dasharray: 180; stroke-dashoffset: 180; animation: drawPalette 2s ease-in-out infinite; }
    .drop { opacity: 0; animation: paletteDrop 2s ease-in-out infinite; }
    .drop1 { animation-delay: 0.1s; }
    .drop2 { animation-delay: 0.25s; }
    .drop3 { animation-delay: 0.4s; }

    @keyframes drawPalette {
      0%, 16%, 100% { stroke-dashoffset: 180; }
      32%, 72% { stroke-dashoffset: 0; }
    }
    @keyframes paletteDrop {
      0%, 18%, 100% { opacity: 0; }
      26%, 54% { opacity: 1; }
      64%, 100% { opacity: 0; }
    }
  </style>
