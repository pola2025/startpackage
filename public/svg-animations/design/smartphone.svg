<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <style>
    .sp-frame {
      stroke-dasharray: 60;
      stroke-dashoffset: 60;
      animation: drawFrame 3.5s cubic-bezier(0.22, 1, 0.36, 1) infinite;
    }
    .sp-screen {
      animation: screenOn 3.5s cubic-bezier(0.22, 1, 0.36, 1) infinite;
      opacity: 0;
    }
    .sp-notch {
      animation: notchFade 3.5s ease-in-out infinite;
      opacity: 0;
    }
    .sp-notif-dot {
      animation: dotPulse 3.5s cubic-bezier(0.34, 1.56, 0.64, 1) infinite;
      transform-origin: 15px 8px;
      opacity: 0;
    }
    .sp-scan-line {
      animation: scanLine 3.5s ease-in-out infinite;
      opacity: 0;
    }
    @keyframes drawFrame {
      0% { stroke-dashoffset: 60; }
      30% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes screenOn {
      0%, 25% { opacity: 0; }
      30% { opacity: 0.15; }
      35% { opacity: 0.05; }
      40% { opacity: 0.25; }
      45%, 75% { opacity: 0.15; }
      85% { opacity: 0.05; }
      95%, 100% { opacity: 0; }
    }
    @keyframes notchFade {
      0%, 25% { opacity: 0; }
      35%, 75% { opacity: 0.7; }
      90% { opacity: 0; }
      100% { opacity: 0; }
    }
    @keyframes dotPulse {
      0%, 40% { opacity: 0; transform: scale(0); }
      48% { opacity: 1; transform: scale(1.5); }
      55% { transform: scale(0.8); }
      60% { transform: scale(1.2); opacity: 1; }
      65%, 72% { transform: scale(1); opacity: 1; }
      73% { transform: scale(1.3); opacity: 0.8; }
      76% { transform: scale(1); opacity: 1; }
      82% { opacity: 1; }
      92% { opacity: 0; }
      100% { opacity: 0; transform: scale(0); }
    }
    @keyframes scanLine {
      0%, 30% { opacity: 0; transform: translateY(0px); }
      40% { opacity: 0.3; }
      60% { opacity: 0.3; transform: translateY(8px); }
      70% { opacity: 0; }
      100% { opacity: 0; }
    }
  </style>
  <rect class="sp-frame" x="5" y="2" width="14" height="20" rx="2" />
  <rect class="sp-screen" x="7" y="5" width="10" height="13" rx="1" fill="currentColor" stroke="none" />
  <line class="sp-scan-line" x1="7" y1="7" x2="17" y2="7" stroke-width="0.5" />
  <line class="sp-notch" x1="10" y1="3.5" x2="14" y2="3.5" stroke-width="1" />
  <circle class="sp-notif-dot" cx="15" cy="8" r="1.5" fill="currentColor" stroke="none" />
  <line x1="12" y1="19" x2="12" y2="19.01" stroke-width="2" />
</svg>
