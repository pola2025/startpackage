<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <style>
    .cert-body {
      animation: certIn 4s cubic-bezier(0.22, 1, 0.36, 1) infinite;
    }
    @keyframes certIn {
      0% { opacity: 0; transform: scale(0.95); }
      10% { opacity: 1; transform: scale(1); }
      100% { opacity: 1; }
    }
    .seal {
      transform-origin: 12px 17px;
      animation: sealStamp 4s cubic-bezier(0.34, 1.56, 0.64, 1) infinite;
    }
    @keyframes sealStamp {
      0%, 15% { transform: scale(0) translateY(-6px); opacity: 0; }
      25% { transform: scale(1.3) translateY(1px); opacity: 1; }
      30% { transform: scale(0.9) translateY(0); }
      35% { transform: scale(1.08) translateY(0); }
      40%, 85% { transform: scale(1) translateY(0); opacity: 1; }
      95%, 100% { opacity: 0.6; }
    }
    .ribbon-l {
      stroke-dasharray: 8;
      stroke-dashoffset: 8;
      animation: ribbonLeft 4s cubic-bezier(0.22, 1, 0.36, 1) infinite;
    }
    .ribbon-r {
      stroke-dasharray: 8;
      stroke-dashoffset: 8;
      animation: ribbonRight 4s cubic-bezier(0.22, 1, 0.36, 1) infinite;
    }
    @keyframes ribbonLeft {
      0%, 38% { stroke-dashoffset: 8; opacity: 0; }
      42% { opacity: 1; }
      55%, 85% { stroke-dashoffset: 0; opacity: 1; }
      95%, 100% { opacity: 0.5; }
    }
    @keyframes ribbonRight {
      0%, 42% { stroke-dashoffset: 8; opacity: 0; }
      46% { opacity: 1; }
      58%, 85% { stroke-dashoffset: 0; opacity: 1; }
      95%, 100% { opacity: 0.5; }
    }
    .text-line {
      stroke-dasharray: 8;
      stroke-dashoffset: 8;
      animation: textDraw 4s ease-out infinite;
    }
    .text-line2 {
      stroke-dasharray: 4;
      stroke-dashoffset: 4;
      animation: textDraw2 4s ease-out infinite;
    }
    @keyframes textDraw {
      0%, 10% { stroke-dashoffset: 8; }
      25% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes textDraw2 {
      0%, 15% { stroke-dashoffset: 4; }
      30% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: 0; }
    }
  </style>
  <g class="cert-body">
    <rect x="3" y="3" width="18" height="14" rx="2"/>
    <line class="text-line" x1="8" y1="7" x2="16" y2="7"/>
    <line class="text-line2" x1="10" y1="10" x2="14" y2="10"/>
  </g>
  <g class="seal">
    <circle cx="12" cy="17" r="2.5"/>
    <path d="M12 14.5v-1"/>
  </g>
  <path class="ribbon-l" d="M10 19l-1.5 3-0.5-1.5"/>
  <path class="ribbon-r" d="M14 19l1.5 3 0.5-1.5"/>
</svg>