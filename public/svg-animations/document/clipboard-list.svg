<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <style>
    .board {
      animation: boardIn 4s cubic-bezier(0.34, 1.56, 0.64, 1) infinite;
    }
    @keyframes boardIn {
      0% { transform: translateY(3px); opacity: 0; }
      10% { transform: translateY(-0.5px); opacity: 1; }
      15% { transform: translateY(0); }
      100% { opacity: 1; }
    }
    .clip {
      animation: clipPop 4s cubic-bezier(0.34, 1.56, 0.64, 1) infinite;
      transform-origin: 12px 3px;
    }
    @keyframes clipPop {
      0%, 3% { transform: scaleY(0); }
      12% { transform: scaleY(1.1); }
      16% { transform: scaleY(1); }
      100% { transform: scaleY(1); }
    }
    .dot1, .row1 { animation: item1 4s cubic-bezier(0.22, 1, 0.36, 1) infinite; }
    .dot2, .row2 { animation: item2 4s cubic-bezier(0.22, 1, 0.36, 1) infinite; }
    .dot3, .row3 { animation: item3 4s cubic-bezier(0.22, 1, 0.36, 1) infinite; }
    .row1 { stroke-dasharray: 6; stroke-dashoffset: 6; }
    .row2 { stroke-dasharray: 6; stroke-dashoffset: 6; }
    .row3 { stroke-dasharray: 4; stroke-dashoffset: 4; }
    @keyframes item1 {
      0%, 18% { opacity: 0; stroke-dashoffset: 6; transform: translateX(-2px); }
      28% { opacity: 1; stroke-dashoffset: 0; transform: translateX(0.5px); }
      32%, 85% { transform: translateX(0); opacity: 1; stroke-dashoffset: 0; }
      95%, 100% { opacity: 0.5; }
    }
    @keyframes item2 {
      0%, 28% { opacity: 0; stroke-dashoffset: 6; transform: translateX(-2px); }
      38% { opacity: 1; stroke-dashoffset: 0; transform: translateX(0.5px); }
      42%, 85% { transform: translateX(0); opacity: 1; stroke-dashoffset: 0; }
      95%, 100% { opacity: 0.5; }
    }
    @keyframes item3 {
      0%, 38% { opacity: 0; stroke-dashoffset: 4; transform: translateX(-2px); }
      48% { opacity: 1; stroke-dashoffset: 0; transform: translateX(0.5px); }
      52%, 85% { transform: translateX(0); opacity: 1; stroke-dashoffset: 0; }
      95%, 100% { opacity: 0.5; }
    }
  </style>
  <g class="board">
    <rect x="5" y="4" width="14" height="18" rx="2"/>
  </g>
  <g class="clip">
    <path d="M9 2h6a1 1 0 0 1 1 1v1a1 1 0 0 1-1 1H9a1 1 0 0 1-1-1V3a1 1 0 0 1 1-1Z"/>
  </g>
  <circle class="dot1" cx="8.5" cy="10" r="0.5" fill="currentColor" stroke="none"/>
  <line class="row1" x1="11" y1="10" x2="17" y2="10"/>
  <circle class="dot2" cx="8.5" cy="14" r="0.5" fill="currentColor" stroke="none"/>
  <line class="row2" x1="11" y1="14" x2="17" y2="14"/>
  <circle class="dot3" cx="8.5" cy="18" r="0.5" fill="currentColor" stroke="none"/>
  <line class="row3" x1="11" y1="18" x2="15" y2="18"/>
</svg>