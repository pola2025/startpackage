<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <style>
    .paper {
      transform-origin: 12px 2px;
      animation: unfold 4s cubic-bezier(0.22, 1, 0.36, 1) infinite;
    }
    @keyframes unfold {
      0% { transform: scaleY(0.3); opacity: 0.3; }
      8% { opacity: 1; }
      20% { transform: scaleY(1.02); }
      25% { transform: scaleY(1); }
      100% { transform: scaleY(1); opacity: 1; }
    }
    .clause1 {
      stroke-dasharray: 10;
      stroke-dashoffset: 10;
      animation: cl1 4s ease-out infinite;
    }
    .clause2 {
      stroke-dasharray: 8;
      stroke-dashoffset: 8;
      animation: cl2 4s ease-out infinite;
    }
    .clause3 {
      stroke-dasharray: 10;
      stroke-dashoffset: 10;
      animation: cl3 4s ease-out infinite;
    }
    @keyframes cl1 {
      0%, 22% { stroke-dashoffset: 10; }
      35% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes cl2 {
      0%, 28% { stroke-dashoffset: 8; }
      42% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes cl3 {
      0%, 34% { stroke-dashoffset: 10; }
      48% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: 0; }
    }
    .sign-line {
      stroke-dasharray: 8;
      stroke-dashoffset: 8;
      animation: signLine 4s ease-out infinite;
    }
    @keyframes signLine {
      0%, 40% { stroke-dashoffset: 8; }
      55% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: 0; }
    }
    .signature {
      stroke-dasharray: 16;
      stroke-dashoffset: 16;
      animation: sigDraw 4s cubic-bezier(0.34, 1.56, 0.64, 1) infinite;
    }
    @keyframes sigDraw {
      0%, 55% { stroke-dashoffset: 16; opacity: 0; }
      60% { opacity: 1; }
      78% { stroke-dashoffset: 0; }
      82% { transform: scale(1.05); }
      86%, 90% { transform: scale(1); stroke-dashoffset: 0; opacity: 1; }
      98%, 100% { opacity: 0.5; }
    }
  </style>
  <g class="paper">
    <path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/>
    <path d="M14 2v4a1 1 0 0 0 1 1h5"/>
    <line class="clause1" x1="8" y1="9" x2="16" y2="9" stroke-width="1.5"/>
    <line class="clause2" x1="8" y1="12" x2="14" y2="12" stroke-width="1.5"/>
    <line class="clause3" x1="8" y1="15" x2="16" y2="15" stroke-width="1.5"/>
    <line class="sign-line" x1="8" y1="19" x2="16" y2="19" stroke-width="1"/>
    <path class="signature" d="M8.5 18c1-1.5 1.8 0.6 3 0s2.2-1.5 3.5 0" stroke-width="1.5"/>
  </g>
</svg>