<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <style>
    .doc {
      animation: docAppear 4s cubic-bezier(0.22, 1, 0.36, 1) infinite;
    }
    @keyframes docAppear {
      0% { opacity: 0; transform: translateY(3px) scale(0.96); }
      10% { opacity: 1; transform: translateY(-0.5px) scale(1.01); }
      16% { transform: translateY(0) scale(1); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }
    .check {
      stroke-dasharray: 12;
      stroke-dashoffset: 12;
      animation: drawCheck 4s cubic-bezier(0.34, 1.56, 0.64, 1) infinite;
    }
    @keyframes drawCheck {
      0%, 25% { stroke-dashoffset: 12; opacity: 0; }
      30% { opacity: 1; }
      45% { stroke-dashoffset: -1; }
      50% { stroke-dashoffset: 0; transform: scale(1.15); }
      58% { transform: scale(0.95); }
      65%, 85% { stroke-dashoffset: 0; transform: scale(1); opacity: 1; }
      95%, 100% { opacity: 0.5; }
    }
    .fold {
      stroke-dasharray: 10;
      stroke-dashoffset: 10;
      animation: foldIn 4s ease-out infinite;
    }
    @keyframes foldIn {
      0%, 5% { stroke-dashoffset: 10; }
      20% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: 0; }
    }
  </style>
  <g class="doc">
    <path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/>
    <path class="fold" d="M14 2v4a1 1 0 0 0 1 1h5"/>
  </g>
  <path class="check" d="M9 13l2.5 2.5L16 11"/>
</svg>