<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <style>
    .magnifier {
      animation: sweep 4s cubic-bezier(0.34, 1.56, 0.64, 1) infinite;
      transform-origin: 15px 15px;
    }
    @keyframes sweep {
      0%, 10% { transform: translate(-5px, -5px) scale(0.8); opacity: 0; }
      20% { transform: translate(-2px, -2px) scale(1); opacity: 1; }
      35% { transform: translate(0px, 1px); }
      50% { transform: translate(2px, -1px); }
      65% { transform: translate(0px, 0px); }
      75% { transform: translate(1px, 1px) scale(1.05); }
      80% { transform: translate(1px, 1px) scale(1); }
      88%, 100% { transform: translate(3px, 3px) scale(0.8); opacity: 0; }
    }
    .lens-shine {
      animation: shine 4s ease-in-out infinite;
    }
    @keyframes shine {
      0%, 15% { opacity: 0; }
      40%, 60% { opacity: 0.4; }
      85%, 100% { opacity: 0; }
    }
    .scan-line {
      animation: scanPulse 4s ease-in-out infinite;
    }
    @keyframes scanPulse {
      0%, 20% { opacity: 0; }
      35% { opacity: 0.6; }
      50% { opacity: 0; }
      65% { opacity: 0.6; }
      80%, 100% { opacity: 0; }
    }
  </style>
  <path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/>
  <path d="M14 2v4a1 1 0 0 0 1 1h5"/>
  <line class="scan-line" x1="8" y1="13" x2="16" y2="13" stroke-width="1" opacity="0"/>
  <g class="magnifier">
    <circle cx="14.5" cy="14.5" r="3"/>
    <line x1="16.8" y1="16.8" x2="20" y2="20"/>
    <circle class="lens-shine" cx="13.5" cy="13.5" r="0.8" fill="currentColor" stroke="none"/>
  </g>
</svg>