<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <style>
    .page {
      transform-origin: 12px 24px;
      animation: pageSlide 4s cubic-bezier(0.34, 1.56, 0.64, 1) infinite;
    }
    @keyframes pageSlide {
      0% { transform: translateY(6px); opacity: 0; }
      12% { transform: translateY(-1px); opacity: 1; }
      18% { transform: translateY(0); }
      100% { transform: translateY(0); opacity: 1; }
    }
    .fold {
      stroke-dasharray: 10;
      stroke-dashoffset: 10;
      animation: foldDraw 4s cubic-bezier(0.22, 1, 0.36, 1) infinite;
    }
    @keyframes foldDraw {
      0%, 8% { stroke-dashoffset: 10; }
      22% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: 0; }
    }
    .line1 {
      stroke-dasharray: 8;
      stroke-dashoffset: 8;
      animation: drawLine1 4s cubic-bezier(0.22, 1, 0.36, 1) infinite;
    }
    .line2 {
      stroke-dasharray: 10;
      stroke-dashoffset: 10;
      animation: drawLine2 4s cubic-bezier(0.22, 1, 0.36, 1) infinite;
    }
    .line3 {
      stroke-dasharray: 6;
      stroke-dashoffset: 6;
      animation: drawLine3 4s cubic-bezier(0.22, 1, 0.36, 1) infinite;
    }
    @keyframes drawLine1 {
      0%, 22% { stroke-dashoffset: 8; opacity: 0; }
      26% { opacity: 1; }
      40%, 85% { stroke-dashoffset: 0; opacity: 1; }
      95%, 100% { stroke-dashoffset: 0; opacity: 0.6; }
    }
    @keyframes drawLine2 {
      0%, 30% { stroke-dashoffset: 10; opacity: 0; }
      34% { opacity: 1; }
      48%, 85% { stroke-dashoffset: 0; opacity: 1; }
      95%, 100% { stroke-dashoffset: 0; opacity: 0.6; }
    }
    @keyframes drawLine3 {
      0%, 38% { stroke-dashoffset: 6; opacity: 0; }
      42% { opacity: 1; }
      56%, 85% { stroke-dashoffset: 0; opacity: 1; }
      95%, 100% { stroke-dashoffset: 0; opacity: 0.6; }
    }
  </style>
  <g class="page">
    <path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/>
    <path class="fold" d="M14 2v4a1 1 0 0 0 1 1h5"/>
    <line class="line1" x1="8" y1="10" x2="16" y2="10"/>
    <line class="line2" x1="8" y1="14" x2="16" y2="14"/>
    <line class="line3" x1="8" y1="18" x2="13" y2="18"/>
  </g>
</svg>