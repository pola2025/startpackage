<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <style>
    .printer {
      animation: printerIn 4s ease-out infinite;
    }
    @keyframes printerIn {
      0% { opacity: 0.5; }
      8% { opacity: 1; }
      100% { opacity: 1; }
    }
    .receipt-body {
      transform-origin: 12px 4px;
      animation: printOut 4s cubic-bezier(0.22, 1, 0.36, 1) infinite;
    }
    @keyframes printOut {
      0% { clip-path: inset(0 0 100% 0); }
      10% { clip-path: inset(0 0 85% 0); }
      25% { clip-path: inset(0 0 55% 0); }
      45% { clip-path: inset(0 0 20% 0); }
      60%, 85% { clip-path: inset(0 0 0% 0); }
      95%, 100% { clip-path: inset(0 0 0% 0); opacity: 0.6; }
    }
    .r-item1 {
      stroke-dasharray: 6;
      stroke-dashoffset: 6;
      animation: ri1 4s ease-out infinite;
    }
    .r-item2 {
      stroke-dasharray: 4;
      stroke-dashoffset: 4;
      animation: ri2 4s ease-out infinite;
    }
    .r-item3 {
      stroke-dasharray: 6;
      stroke-dashoffset: 6;
      animation: ri3 4s ease-out infinite;
    }
    .r-total {
      stroke-dasharray: 6;
      stroke-dashoffset: 6;
      animation: riTotal 4s cubic-bezier(0.34, 1.56, 0.64, 1) infinite;
    }
    @keyframes ri1 {
      0%, 20% { stroke-dashoffset: 6; }
      35% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes ri2 {
      0%, 30% { stroke-dashoffset: 4; }
      45% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes ri3 {
      0%, 40% { stroke-dashoffset: 6; }
      55% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes riTotal {
      0%, 50% { stroke-dashoffset: 6; }
      65% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: 0; }
    }
    .tear {
      animation: tearWiggle 4s ease-in-out infinite;
    }
    @keyframes tearWiggle {
      0%, 60% { transform: translateY(0); }
      65% { transform: translateY(0.3px); }
      70% { transform: translateY(-0.3px); }
      75% { transform: translateY(0.2px); }
      80%, 100% { transform: translateY(0); }
    }
  </style>
  <!-- printer slot -->
  <g class="printer">
    <line x1="6" y1="3" x2="18" y2="3" stroke-width="2.5"/>
  </g>
  <!-- receipt paper -->
  <g class="receipt-body">
    <path d="M6 3h12v17l-1.5-1-1.5 1-1.5-1-1.5 1-1.5-1-1.5 1-1.5-1L6 20Z"/>
    <line class="r-item1" x1="9" y1="8" x2="15" y2="8" stroke-width="1.5"/>
    <line class="r-item2" x1="9" y1="11" x2="13" y2="11" stroke-width="1.5"/>
    <line class="r-item3" x1="9" y1="14" x2="15" y2="14" stroke-width="1.5"/>
    <line x1="8" y1="16.5" x2="16" y2="16.5" stroke-width="0.8" stroke-dasharray="1 1"/>
    <line class="r-total" x1="10" y1="18" x2="14" y2="18" stroke-width="1.8"/>
  </g>
</svg>