<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <style>
    .base {
      animation: baseIn 4s cubic-bezier(0.22, 1, 0.36, 1) infinite;
    }
    @keyframes baseIn {
      0% { opacity: 0; }
      10% { opacity: 1; }
      100% { opacity: 1; }
    }
    .stamp-head {
      animation: stampDown 4s cubic-bezier(0.22, 1, 0.36, 1) infinite;
      transform-origin: 12px 12px;
    }
    @keyframes stampDown {
      0%, 10% { transform: translateY(-8px) rotate(-3deg); }
      25% { transform: translateY(1px) rotate(0); }
      30% { transform: translateY(-2px) rotate(0.5deg); }
      35% { transform: translateY(0.5px) rotate(0); }
      38% { transform: translateY(-0.5px); }
      42%, 85% { transform: translateY(0) rotate(0); }
      92%, 100% { transform: translateY(-8px) rotate(-3deg); }
    }
    .mark {
      transform-origin: 12px 19px;
      animation: markAppear 4s cubic-bezier(0.34, 1.56, 0.64, 1) infinite;
    }
    @keyframes markAppear {
      0%, 24% { opacity: 0; transform: scale(0.5); }
      30% { opacity: 0.9; transform: scale(1.15); }
      36% { transform: scale(0.95); opacity: 1; }
      42%, 85% { transform: scale(1); opacity: 1; }
      92%, 100% { opacity: 0; transform: scale(0.8); }
    }
    .impact {
      transform-origin: 12px 17px;
      animation: impactRing 4s ease-out infinite;
    }
    @keyframes impactRing {
      0%, 24% { opacity: 0; transform: scale(0.5); }
      28% { opacity: 0.5; transform: scale(1); }
      38% { opacity: 0; transform: scale(1.8); }
      100% { opacity: 0; }
    }
  </style>
  <!-- base surface -->
  <line class="base" x1="4" y1="22" x2="20" y2="22"/>
  <!-- stamp body -->
  <g class="stamp-head">
    <rect x="6" y="4" width="12" height="8" rx="1"/>
    <path d="M8 12h8v4H8z"/>
    <line x1="10" y1="6" x2="14" y2="6" stroke-width="1.5"/>
    <line x1="10" y1="9" x2="14" y2="9" stroke-width="1"/>
  </g>
  <!-- impact ring -->
  <circle class="impact" cx="12" cy="19" r="3" stroke-width="1" fill="none"/>
  <!-- stamp mark left on surface -->
  <g class="mark">
    <circle cx="12" cy="19" r="2.5" stroke-width="1.5"/>
    <line x1="10.5" y1="19" x2="13.5" y2="19" stroke-width="1"/>
  </g>
</svg>