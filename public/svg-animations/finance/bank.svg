<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <style>
    .bank-roof {
      transform-origin: 12px 8px;
      animation: roofDrop 4s cubic-bezier(0.34, 1.56, 0.64, 1) infinite;
    }
    .bank-col1 {
      transform-origin: 5px 20px;
      animation: colGrow 4s cubic-bezier(0.34, 1.56, 0.64, 1) infinite 0.3s;
    }
    .bank-col2 {
      transform-origin: 9px 20px;
      animation: colGrow 4s cubic-bezier(0.34, 1.56, 0.64, 1) infinite 0.45s;
    }
    .bank-col3 {
      transform-origin: 15px 20px;
      animation: colGrow 4s cubic-bezier(0.34, 1.56, 0.64, 1) infinite 0.6s;
    }
    .bank-col4 {
      transform-origin: 19px 20px;
      animation: colGrow 4s cubic-bezier(0.34, 1.56, 0.64, 1) infinite 0.75s;
    }
    .bank-base {
      stroke-dasharray: 20;
      stroke-dashoffset: 20;
      animation: drawBase 4s ease infinite;
    }
    .bank-pediment {
      stroke-dasharray: 20;
      stroke-dashoffset: 20;
      animation: drawBase 4s ease infinite 0.1s;
    }
    .bank-flag {
      animation: flagWave 4s ease infinite;
    }
    @keyframes roofDrop {
      0% { transform: translateY(-6px); opacity: 0; }
      12% { transform: translateY(1px); opacity: 1; }
      18% { transform: translateY(-0.5px); }
      22%, 80% { transform: translateY(0); opacity: 1; }
      92%, 100% { transform: translateY(-6px); opacity: 0; }
    }
    @keyframes colGrow {
      0%, 10% { transform: scaleY(0); opacity: 0; }
      25% { transform: scaleY(1.06); opacity: 1; }
      32%, 80% { transform: scaleY(1); opacity: 1; }
      92%, 100% { transform: scaleY(0); opacity: 0; }
    }
    @keyframes drawBase {
      0%, 5% { stroke-dashoffset: 20; }
      18%, 82% { stroke-dashoffset: 0; }
      92%, 100% { stroke-dashoffset: 20; }
    }
    @keyframes flagWave {
      0%, 30% { opacity: 0; }
      38% { opacity: 1; }
      45% { transform: rotate(3deg); }
      55% { transform: rotate(-3deg); }
      65% { transform: rotate(2deg); }
      75%, 80% { transform: rotate(0deg); opacity: 1; }
      90%, 100% { opacity: 0; }
    }
  </style>
  <rect class="bank-base" x="2" y="20" width="20" height="2" rx="0.5"/>
  <line class="bank-col1" x1="5" y1="8" x2="5" y2="20" stroke-width="1.8"/>
  <line class="bank-col2" x1="9" y1="8" x2="9" y2="20" stroke-width="1.8"/>
  <line class="bank-col3" x1="15" y1="8" x2="15" y2="20" stroke-width="1.8"/>
  <line class="bank-col4" x1="19" y1="8" x2="19" y2="20" stroke-width="1.8"/>
  <line class="bank-pediment" x1="2" y1="8" x2="22" y2="8"/>
  <g class="bank-roof">
    <polygon points="12 2 2 8 22 8"/>
  </g>
</svg>
