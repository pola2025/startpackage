<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <style>
    .btn1 { animation: btnPulse 2s ease-in-out infinite; }
    .btn2 { animation: btnPulse 2s ease-in-out infinite 0.3s; }
    .btn3 { animation: btnPulse 2s ease-in-out infinite 0.6s; }
    .btn4 { animation: btnPulse 2s ease-in-out infinite 0.9s; }
    @keyframes btnPulse {
      0%, 20%, 100% { opacity: 1; }
      10% { opacity: 0.4; }
    }
  </style>
  <rect x="4" y="2" width="16" height="20" rx="2"/>
  <rect x="7" y="5" width="10" height="4" rx="1"/>
  <circle class="btn1" cx="8.5" cy="12.5" r="0.8" fill="currentColor" stroke="none"/>
  <circle class="btn2" cx="12" cy="12.5" r="0.8" fill="currentColor" stroke="none"/>
  <circle class="btn3" cx="15.5" cy="12.5" r="0.8" fill="currentColor" stroke="none"/>
  <circle class="btn4" cx="8.5" cy="16" r="0.8" fill="currentColor" stroke="none"/>
  <circle cx="12" cy="16" r="0.8" fill="currentColor" stroke="none"/>
  <circle cx="15.5" cy="16" r="0.8" fill="currentColor" stroke="none"/>
  <circle cx="8.5" cy="19.5" r="0.8" fill="currentColor" stroke="none"/>
  <rect x="11" y="18.7" width="5.5" height="1.6" rx="0.8" fill="currentColor" stroke="none"/>
</svg>
