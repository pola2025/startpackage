<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <style>
    .bar1 { transform-origin: 6px 21px; animation: growBar1 4s cubic-bezier(0.34, 1.56, 0.64, 1) infinite; }
    .bar2 { transform-origin: 11px 21px; animation: growBar2 4s cubic-bezier(0.34, 1.56, 0.64, 1) infinite; }
    .bar3 { transform-origin: 16px 21px; animation: growBar3 4s cubic-bezier(0.34, 1.56, 0.64, 1) infinite; }
    .bar-cap1 { animation: capPop 4s ease infinite 0.5s; }
    .bar-cap2 { animation: capPop 4s ease infinite 0.7s; }
    .bar-cap3 { animation: capPop 4s ease infinite 0.9s; }
    .baseline {
      stroke-dasharray: 18;
      stroke-dashoffset: 18;
      animation: drawBase 4s ease infinite;
    }
    @keyframes drawBase {
      0% { stroke-dashoffset: 18; }
      10%, 85% { stroke-dashoffset: 0; }
      95%, 100% { stroke-dashoffset: 18; }
    }
    @keyframes growBar1 {
      0%, 8% { transform: scaleY(0); }
      22% { transform: scaleY(1.08); }
      28%, 78% { transform: scaleY(1); }
      90%, 100% { transform: scaleY(0); }
    }
    @keyframes growBar2 {
      0%, 14% { transform: scaleY(0); }
      28% { transform: scaleY(1.08); }
      34%, 78% { transform: scaleY(1); }
      90%, 100% { transform: scaleY(0); }
    }
    @keyframes growBar3 {
      0%, 20% { transform: scaleY(0); }
      34% { transform: scaleY(1.12); }
      40%, 78% { transform: scaleY(1); }
      90%, 100% { transform: scaleY(0); }
    }
    @keyframes capPop {
      0%, 30% { opacity: 0; transform: scale(0); }
      40% { opacity: 1; transform: scale(1.3); }
      50%, 75% { opacity: 1; transform: scale(1); }
      85%, 100% { opacity: 0; transform: scale(0); }
    }
  </style>
  <line class="baseline" x1="3" y1="21" x2="21" y2="21"/>
  <rect class="bar1" x="4" y="10" width="4" height="11" rx="1"/>
  <rect class="bar2" x="9" y="6" width="4" height="15" rx="1"/>
  <rect class="bar3" x="14" y="13" width="4" height="8" rx="1"/>
  <circle class="bar-cap1" cx="6" cy="9.5" r="0.8" fill="currentColor" stroke="none" opacity="0" style="transform-origin:6px 9.5px"/>
  <circle class="bar-cap2" cx="11" cy="5.5" r="0.8" fill="currentColor" stroke="none" opacity="0" style="transform-origin:11px 5.5px"/>
  <circle class="bar-cap3" cx="16" cy="12.5" r="0.8" fill="currentColor" stroke="none" opacity="0" style="transform-origin:16px 12.5px"/>
</svg>
