<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <style>
    .axis-v {
      stroke-dasharray: 18;
      stroke-dashoffset: 18;
      animation: drawAxis 4s cubic-bezier(0.25, 0.46, 0.45, 0.94) infinite;
    }
    .axis-h {
      stroke-dasharray: 18;
      stroke-dashoffset: 18;
      animation: drawAxis 4s cubic-bezier(0.25, 0.46, 0.45, 0.94) infinite 0.15s;
    }
    .chart-path {
      stroke-dasharray: 42;
      stroke-dashoffset: 42;
      animation: drawLine 4s cubic-bezier(0.22, 0.61, 0.36, 1) infinite;
    }
    .peak-dot {
      animation: dotPulse 4s ease infinite;
    }
    .grid-lines {
      animation: gridFade 4s ease infinite;
    }
    .arrow-up {
      animation: arrowBounce 4s cubic-bezier(0.34, 1.56, 0.64, 1) infinite;
    }
    @keyframes drawAxis {
      0%, 3% { stroke-dashoffset: 18; }
      12%, 82% { stroke-dashoffset: 0; }
      92%, 100% { stroke-dashoffset: 18; }
    }
    @keyframes drawLine {
      0%, 12% { stroke-dashoffset: 42; }
      40%, 75% { stroke-dashoffset: 0; }
      88%, 100% { stroke-dashoffset: 42; }
    }
    @keyframes dotPulse {
      0%, 38% { transform: scale(0); opacity: 0; }
      42% { transform: scale(1.4); opacity: 1; }
      46%, 65% { transform: scale(1); opacity: 1; }
      70% { transform: scale(1.3); opacity: 0.8; }
      75%, 80% { transform: scale(1); opacity: 1; }
      90%, 100% { transform: scale(0); opacity: 0; }
    }
    @keyframes gridFade {
      0%, 8% { opacity: 0; }
      16%, 80% { opacity: 0.2; }
      90%, 100% { opacity: 0; }
    }
    @keyframes arrowBounce {
      0%, 42% { transform: translateY(3px); opacity: 0; }
      50% { transform: translateY(-1px); opacity: 1; }
      55%, 75% { transform: translateY(0); opacity: 1; }
      88%, 100% { transform: translateY(3px); opacity: 0; }
    }
  </style>
  <g class="grid-lines" opacity="0">
    <line x1="3" y1="9" x2="21" y2="9" stroke-width="0.5"/>
    <line x1="3" y1="13" x2="21" y2="13" stroke-width="0.5"/>
    <line x1="3" y1="17" x2="21" y2="17" stroke-width="0.5"/>
  </g>
  <line class="axis-v" x1="3" y1="21" x2="3" y2="3"/>
  <line class="axis-h" x1="3" y1="21" x2="21" y2="21"/>
  <polyline class="chart-path" points="3 17 8 12 13 14 21 5"/>
  <circle class="peak-dot" cx="21" cy="5" r="1.5" fill="currentColor" stroke="none" style="transform-origin:21px 5px"/>
  <polyline class="arrow-up" points="18 5 21 3 21 7" stroke-width="1.5" fill="none"/>
</svg>
