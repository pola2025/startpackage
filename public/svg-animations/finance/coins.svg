<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <style>
    .coin-layer1 {
      animation: stackIn1 4s cubic-bezier(0.34, 1.56, 0.64, 1) infinite;
    }
    .coin-layer2 {
      animation: stackIn2 4s cubic-bezier(0.34, 1.56, 0.64, 1) infinite;
    }
    .coin-layer3 {
      animation: stackIn3 4s cubic-bezier(0.34, 1.56, 0.64, 1) infinite;
    }
    .coin-layer4 {
      animation: stackIn4 4s cubic-bezier(0.34, 1.56, 0.64, 1) infinite;
    }
    .coin-shine {
      animation: coinShine 4s ease infinite 1.5s;
    }
    @keyframes stackIn1 {
      0%, 5% { transform: translateY(4px); opacity: 0; }
      12% { transform: translateY(-1px); opacity: 1; }
      18%, 80% { transform: translateY(0); opacity: 1; }
      90%, 100% { transform: translateY(4px); opacity: 0; }
    }
    @keyframes stackIn2 {
      0%, 12% { transform: translateY(4px); opacity: 0; }
      22% { transform: translateY(-1.5px); opacity: 1; }
      28%, 80% { transform: translateY(0); opacity: 1; }
      90%, 100% { transform: translateY(4px); opacity: 0; }
    }
    @keyframes stackIn3 {
      0%, 22% { transform: translateY(4px); opacity: 0; }
      32% { transform: translateY(-2px); opacity: 1; }
      38%, 80% { transform: translateY(0); opacity: 1; }
      90%, 100% { transform: translateY(4px); opacity: 0; }
    }
    @keyframes stackIn4 {
      0%, 32% { transform: translateY(8px); opacity: 0; }
      42% { transform: translateY(-3px); opacity: 1; }
      48% { transform: translateY(0.5px); }
      52%, 80% { transform: translateY(0); opacity: 1; }
      90%, 100% { transform: translateY(8px); opacity: 0; }
    }
    @keyframes coinShine {
      0%, 10% { opacity: 0; }
      20% { opacity: 0.6; }
      40% { opacity: 0; }
      100% { opacity: 0; }
    }
  </style>
  <g class="coin-layer1">
    <ellipse cx="12" cy="18" rx="7" ry="3"/>
  </g>
  <g class="coin-layer2">
    <ellipse cx="12" cy="14" rx="7" ry="3"/>
    <path d="M5 14v4" stroke-width="1.5"/>
    <path d="M19 14v4" stroke-width="1.5"/>
  </g>
  <g class="coin-layer3">
    <ellipse cx="12" cy="10" rx="7" ry="3"/>
    <path d="M5 10v4" stroke-width="1.5"/>
    <path d="M19 10v4" stroke-width="1.5"/>
  </g>
  <g class="coin-layer4">
    <ellipse cx="12" cy="6" rx="7" ry="3"/>
    <path d="M5 6v4" stroke-width="1.5"/>
    <path d="M19 6v4" stroke-width="1.5"/>
    <ellipse class="coin-shine" cx="12" cy="6" rx="4" ry="1.5" fill="currentColor" stroke="none" opacity="0"/>
  </g>
</svg>
