<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <style>
    .money-bag {
      transform-origin: 12px 20px;
      animation: bagBreathe 4s cubic-bezier(0.34, 1.56, 0.64, 1) infinite;
    }
    .dollar-sign {
      stroke-dasharray: 30;
      stroke-dashoffset: 30;
      animation: drawDollar 4s ease infinite;
    }
    .flow1 { animation: flowUp 4s cubic-bezier(0.22, 0.61, 0.36, 1) infinite 0.6s; }
    .flow2 { animation: flowUp 4s cubic-bezier(0.22, 0.61, 0.36, 1) infinite 1.0s; }
    .flow3 { animation: flowUp 4s cubic-bezier(0.22, 0.61, 0.36, 1) infinite 1.4s; }
    .sparkle1 { animation: sparkle 4s ease infinite 1.0s; }
    .sparkle2 { animation: sparkle 4s ease infinite 1.3s; }
    .sparkle3 { animation: sparkle 4s ease infinite 1.6s; }
    @keyframes bagBreathe {
      0%, 15% { transform: scale(0.95); }
      25% { transform: scale(1.04); }
      32%, 80% { transform: scale(1); }
      90%, 100% { transform: scale(0.95); }
    }
    @keyframes drawDollar {
      0%, 20% { stroke-dashoffset: 30; opacity: 0; }
      35% { stroke-dashoffset: 0; opacity: 1; }
      70% { stroke-dashoffset: 0; opacity: 1; }
      85%, 100% { stroke-dashoffset: 30; opacity: 0; }
    }
    @keyframes flowUp {
      0% { transform: translateY(0); opacity: 0; }
      15% { opacity: 0.9; }
      50% { transform: translateY(-6px); opacity: 0.6; }
      80% { transform: translateY(-10px); opacity: 0; }
      100% { opacity: 0; }
    }
    @keyframes sparkle {
      0%, 10% { transform: scale(0) rotate(0deg); opacity: 0; }
      20% { transform: scale(1.2) rotate(45deg); opacity: 1; }
      30% { transform: scale(0.8) rotate(90deg); opacity: 0.6; }
      40% { transform: scale(1) rotate(135deg); opacity: 0; }
      100% { opacity: 0; }
    }
  </style>
  <g class="money-bag">
    <path d="M9 3h6l-1 3H10L9 3Z"/>
    <path d="M10 6C7 8 4 11 4 16c0 3 3.5 5 8 5s8-2 8-5c0-5-3-8-6-10"/>
  </g>
  <g class="dollar-sign">
    <line x1="12" y1="11" x2="12" y2="19"/>
    <path d="M9.5 13.5c0-1.1 1.1-2 2.5-2s2.5.9 2.5 2-1.1 2-2.5 2-2.5.9-2.5 2 1.1 2 2.5 2 2.5-.9 2.5-2"/>
  </g>
  <!-- Money flow particles -->
  <circle class="flow1" cx="9" cy="6" r="1" fill="currentColor" stroke="none" opacity="0"/>
  <circle class="flow2" cx="12" cy="5" r="1.2" fill="currentColor" stroke="none" opacity="0"/>
  <circle class="flow3" cx="15" cy="6" r="0.8" fill="currentColor" stroke="none" opacity="0"/>
  <!-- Sparkle trail -->
  <g class="sparkle1" style="transform-origin:7px 3px" opacity="0">
    <line x1="7" y1="1.5" x2="7" y2="4.5" stroke-width="1.2"/>
    <line x1="5.5" y1="3" x2="8.5" y2="3" stroke-width="1.2"/>
  </g>
  <g class="sparkle2" style="transform-origin:12px 1px" opacity="0">
    <line x1="12" y1="-0.5" x2="12" y2="2.5" stroke-width="1.2"/>
    <line x1="10.5" y1="1" x2="13.5" y2="1" stroke-width="1.2"/>
  </g>
  <g class="sparkle3" style="transform-origin:17px 2px" opacity="0">
    <line x1="17" y1="0.5" x2="17" y2="3.5" stroke-width="1.2"/>
    <line x1="15.5" y1="2" x2="18.5" y2="2" stroke-width="1.2"/>
  </g>
</svg>
