<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <style>
    .piggy-coin {
      animation: coinDrop 2s ease-in-out infinite;
    }
    @keyframes coinDrop {
      0% { transform: translateY(-4px); opacity: 0; }
      30% { transform: translateY(0); opacity: 1; }
      70% { opacity: 1; }
      100% { opacity: 0; }
    }
  </style>
  <!-- Piggy body -->
  <path d="M19 10c0 4-3.5 7-8 7s-8-3-8-7 3.5-7 8-7 8 3 8 7Z"/>
  <!-- Ear -->
  <path d="M15 5c1-1.5 2.5-2 3-1s-.5 2.5-1.5 3"/>
  <!-- Snout -->
  <circle cx="20" cy="11" r="1.5"/>
  <!-- Legs -->
  <line x1="7" y1="17" x2="7" y2="20"/>
  <line x1="15" y1="17" x2="15" y2="20"/>
  <!-- Eye -->
  <circle cx="14" cy="9" r="0.5" fill="currentColor" stroke="none"/>
  <!-- Coin slot -->
  <line x1="9" y1="3" x2="13" y2="3"/>
  <!-- Dropping coin -->
  <ellipse class="piggy-coin" cx="11" cy="1.5" rx="1.5" ry="0.7"/>
</svg>
