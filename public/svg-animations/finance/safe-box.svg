<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <style>
    .safe-handle {
      transform-origin: 14px 12px;
      animation: handleRotate 2s ease-in-out infinite;
    }
    @keyframes handleRotate {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(25deg); }
    }
  </style>
  <!-- Safe body -->
  <rect x="2" y="4" width="20" height="16" rx="2"/>
  <!-- Legs -->
  <line x1="6" y1="20" x2="6" y2="22"/>
  <line x1="18" y1="20" x2="18" y2="22"/>
  <!-- Handle -->
  <circle class="safe-handle" cx="14" cy="12" r="3"/>
  <line class="safe-handle" cx="14" cy="12" x1="14" y1="9" x2="14" y2="12"/>
  <!-- Hinge line -->
  <line x1="2" y1="12" x2="4" y2="12"/>
</svg>
