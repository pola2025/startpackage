<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SVG Animation Archive — Icons &amp; Scenes</title>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"
    />
    <style>
      :root {
        --bg: #faf8f5;
        --bg-warm: #f5f0ea;
        --surface: #ffffff;
        --gold: #b08d3e;
        --gold-light: #c9a84c;
        --gold-pale: rgba(176, 141, 62, 0.08);
        --gold-border: rgba(176, 141, 62, 0.2);
        --coffee: #6b5344;
        --navy: #0d1b2a;
        --text: #2c2420;
        --text-sub: #5c5248;
        --text-muted: #9c9088;
        --border: #e8e0d8;
        --border-light: #f0ebe5;
        --ok: #16a34a;
        --terra: #b85e52;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family:
          "Pretendard",
          -apple-system,
          sans-serif;
        background: var(--bg);
        color: var(--text);
        line-height: 1.7;
      }

      /* Header */
      .page-header {
        text-align: center;
        padding: 48px 24px 32px;
        background: linear-gradient(180deg, var(--bg) 0%, var(--bg-warm) 100%);
        border-bottom: 1px solid var(--border);
      }
      .page-header h1 {
        font-size: 28px;
        font-weight: 800;
        margin-bottom: 6px;
      }
      .page-header p {
        font-size: 14px;
        color: var(--text-sub);
      }
      .stats {
        display: flex;
        justify-content: center;
        gap: 32px;
        margin-top: 16px;
      }
      .stat {
        text-align: center;
      }
      .stat-num {
        font-size: 28px;
        font-weight: 800;
        color: var(--gold);
      }
      .stat-label {
        font-size: 11px;
        color: var(--text-muted);
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }

      /* Tab Nav */
      .tab-nav {
        display: flex;
        justify-content: center;
        gap: 4px;
        padding: 16px 24px;
        background: var(--bg-warm);
        position: sticky;
        top: 0;
        z-index: 100;
        border-bottom: 1px solid var(--border);
      }
      .tab-btn {
        padding: 8px 20px;
        border: 1px solid var(--border);
        border-radius: 100px;
        background: var(--surface);
        font-family: inherit;
        font-size: 13px;
        font-weight: 600;
        color: var(--text-sub);
        cursor: pointer;
        transition: all 0.2s;
      }
      .tab-btn:hover {
        border-color: var(--gold-border);
        color: var(--gold);
      }
      .tab-btn.active {
        background: var(--gold);
        color: #fff;
        border-color: var(--gold);
      }

      /* Controls */
      .controls {
        max-width: 1200px;
        margin: 0 auto;
        padding: 20px 24px;
        display: flex;
        gap: 16px;
        align-items: center;
        flex-wrap: wrap;
      }
      .search-box {
        flex: 1;
        min-width: 200px;
        padding: 8px 14px;
        border: 1px solid var(--border);
        border-radius: 10px;
        font-family: inherit;
        font-size: 13px;
        background: var(--surface);
        outline: none;
        transition: border-color 0.2s;
      }
      .search-box:focus {
        border-color: var(--gold);
      }
      .control-group {
        display: flex;
        gap: 4px;
        align-items: center;
      }
      .control-label {
        font-size: 11px;
        font-weight: 700;
        color: var(--text-muted);
        margin-right: 4px;
      }
      .size-btn,
      .color-btn {
        border: 1px solid var(--border);
        border-radius: 6px;
        background: var(--surface);
        cursor: pointer;
        font-family: inherit;
        font-size: 11px;
        font-weight: 600;
        color: var(--text-sub);
        transition: all 0.15s;
      }
      .size-btn {
        padding: 4px 10px;
      }
      .size-btn.active {
        background: var(--navy);
        color: #fff;
        border-color: var(--navy);
      }
      .color-btn {
        width: 22px;
        height: 22px;
        border-radius: 50%;
        border: 2px solid transparent;
        padding: 0;
      }
      .color-btn.active {
        border-color: var(--navy);
        box-shadow: 0 0 0 2px var(--bg);
      }

      /* Main Content */
      .content {
        max-width: 1200px;
        margin: 0 auto;
        padding: 0 24px 60px;
      }
      .section {
        display: none;
      }
      .section.active {
        display: block;
      }

      /* Icons Section */
      .category {
        margin-bottom: 36px;
      }
      .cat-header {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 12px;
        padding-bottom: 8px;
        border-bottom: 1px solid var(--border-light);
      }
      .cat-dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
      }
      .cat-name {
        font-size: 15px;
        font-weight: 700;
      }
      .cat-count {
        font-size: 11px;
        color: var(--text-muted);
      }
      .icon-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
        gap: 10px;
      }
      .icon-card {
        background: var(--surface);
        border: 1px solid var(--border-light);
        border-radius: 12px;
        padding: 14px 8px 10px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
        transition: all 0.2s;
        cursor: pointer;
      }
      .icon-card:hover {
        border-color: var(--gold-border);
        box-shadow: 0 2px 12px rgba(176, 141, 62, 0.12);
        transform: translateY(-2px);
      }
      .icon-card.upgraded {
        border-left: 3px solid var(--gold);
      }
      .icon-card object {
        pointer-events: none;
      }
      .icon-card .name {
        font-size: 9px;
        color: var(--text-muted);
        text-align: center;
        word-break: break-all;
      }
      .icon-card .badge {
        font-size: 8px;
        background: var(--gold-pale);
        color: var(--gold);
        padding: 1px 6px;
        border-radius: 4px;
        font-weight: 700;
      }

      /* Scenes Section */
      .scene-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
        gap: 20px;
        margin-top: 20px;
      }
      .scene-card {
        background: var(--surface);
        border: 1px solid var(--border-light);
        border-radius: 16px;
        overflow: hidden;
        transition: all 0.2s;
      }
      .scene-card:hover {
        box-shadow: 0 4px 20px rgba(44, 36, 32, 0.1);
        transform: translateY(-2px);
      }
      .scene-thumb {
        height: 180px;
        background: var(--bg);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 48px;
        color: var(--gold);
        position: relative;
        overflow: hidden;
      }
      .scene-thumb .overlay {
        position: absolute;
        inset: 0;
        background: rgba(176, 141, 62, 0);
        display: flex;
        align-items: center;
        justify-content: center;
        transition: background 0.3s;
      }
      .scene-card:hover .overlay {
        background: rgba(176, 141, 62, 0.08);
      }
      .overlay-text {
        opacity: 0;
        font-size: 13px;
        font-weight: 700;
        color: var(--gold);
        background: var(--surface);
        padding: 6px 16px;
        border-radius: 100px;
        border: 1px solid var(--gold-border);
        transition: opacity 0.3s;
      }
      .scene-card:hover .overlay-text {
        opacity: 1;
      }
      .scene-info {
        padding: 16px 20px;
      }
      .scene-info h3 {
        font-size: 16px;
        font-weight: 700;
        margin-bottom: 4px;
      }
      .scene-info .scene-meta {
        font-size: 12px;
        color: var(--text-muted);
        display: flex;
        gap: 12px;
      }
      .scene-info .scene-meta span {
        display: flex;
        align-items: center;
        gap: 4px;
      }

      /* Hidden */
      .hidden {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <div class="page-header">
      <h1>SVG Animation Archive</h1>
      <p>
        Warm Consulting Design System — Animated Icons &amp; Scene Illustrations
      </p>
      <div class="stats">
        <div class="stat">
          <div class="stat-num">50</div>
          <div class="stat-label">Upgraded Icons</div>
        </div>
        <div class="stat">
          <div class="stat-num">100</div>
          <div class="stat-label">Scene Animations</div>
        </div>
        <div class="stat">
          <div class="stat-num">7</div>
          <div class="stat-label">Categories</div>
        </div>
      </div>
    </div>

    <div class="tab-nav">
      <button class="tab-btn active" onclick="switchTab('icons')">
        Icons (50)
      </button>
      <button class="tab-btn" onclick="switchTab('scenes')">
        Scenes (100)
      </button>
      <button class="tab-btn" onclick="switchTab('all-icons')">
        All Icons (101)
      </button>
    </div>

    <div class="controls" id="icon-controls">
      <input
        type="text"
        class="search-box"
        id="searchBox"
        placeholder="Search icons..."
        oninput="filterIcons()"
      />
      <div class="control-group">
        <span class="control-label">SIZE</span>
        <button class="size-btn" onclick="setSize(24)">24</button>
        <button class="size-btn active" onclick="setSize(32)">32</button>
        <button class="size-btn" onclick="setSize(48)">48</button>
        <button class="size-btn" onclick="setSize(64)">64</button>
      </div>
      <div class="control-group">
        <span class="control-label">COLOR</span>
        <button
          class="color-btn active"
          style="background: #2c2420"
          onclick="setColor('#2c2420')"
        ></button>
        <button
          class="color-btn"
          style="background: #b08d3e"
          onclick="setColor('#b08d3e')"
        ></button>
        <button
          class="color-btn"
          style="background: #6b5344"
          onclick="setColor('#6b5344')"
        ></button>
        <button
          class="color-btn"
          style="background: #16a34a"
          onclick="setColor('#16a34a')"
        ></button>
        <button
          class="color-btn"
          style="background: #b85e52"
          onclick="setColor('#b85e52')"
        ></button>
        <button
          class="color-btn"
          style="background: #0d1b2a"
          onclick="setColor('#0d1b2a')"
        ></button>
      </div>
    </div>

    <div class="content">
      <!-- ICONS SECTION (upgraded 50) -->
      <div class="section active" id="section-icons"></div>

      <!-- SCENES SECTION -->
      <div class="section" id="section-scenes">
        <div class="scene-grid" id="sceneGrid"></div>
      </div>

      <!-- ALL ICONS SECTION (full 101) -->
      <div class="section" id="section-all-icons"></div>
    </div>

    <script>
      // ============ DATA ============
      const UPGRADED_ICONS = {
        status: {
          color: "#b08d3e",
          label: "Status",
          icons: [
            "check-circle",
            "check-double",
            "alert-circle",
            "alert-triangle",
            "clock",
            "hourglass",
            "progress-ring",
            "shield-check",
            "trending-up",
            "sparkles",
          ],
        },
        document: {
          color: "#6b5344",
          label: "Document",
          icons: [
            "file-text",
            "file-check",
            "file-warning",
            "file-search",
            "clipboard-check",
            "clipboard-list",
            "certificate",
            "contract",
            "stamp",
            "receipt",
          ],
        },
        finance: {
          color: "#16a34a",
          label: "Finance",
          icons: [
            "wallet",
            "credit-card",
            "banknote",
            "coins",
            "chart-line",
            "chart-bar",
            "bank",
            "funding",
            "hand-coins",
            "percent",
          ],
        },
        navigation: {
          color: "#0d1b2a",
          label: "Navigation",
          icons: [
            "arrow-right",
            "home",
            "search",
            "compass",
            "map-pin",
            "chevron-down",
            "external-link",
          ],
        },
        people: {
          color: "#b85e52",
          label: "People",
          icons: ["user", "users", "handshake", "user-check", "phone", "mail"],
        },
        notification: {
          color: "#c9a84c",
          label: "Notification",
          icons: ["bell", "bell-ring", "send", "download", "zap"],
        },
        design: {
          color: "#5c5248",
          label: "Design",
          icons: ["smartphone", "layers"],
        },
      };

      const ALL_ICONS = {
        status: {
          color: "#b08d3e",
          label: "Status",
          icons: [
            "check-circle",
            "check-double",
            "circle-dot",
            "alert-triangle",
            "alert-circle",
            "x-circle",
            "clock",
            "hourglass",
            "loader-circle",
            "progress-ring",
            "shield-check",
            "sparkles",
            "trending-up",
            "trophy",
            "flame",
          ],
        },
        document: {
          color: "#6b5344",
          label: "Document",
          icons: [
            "file-text",
            "file-check",
            "file-warning",
            "file-search",
            "clipboard-list",
            "clipboard-check",
            "folder-open",
            "folder-archive",
            "receipt",
            "stamp",
            "contract",
            "bookmark",
            "certificate",
            "id-card",
            "form-input",
          ],
        },
        finance: {
          color: "#16a34a",
          label: "Finance",
          icons: [
            "wallet",
            "credit-card",
            "banknote",
            "coins",
            "piggy-bank",
            "chart-line",
            "chart-bar",
            "calculator",
            "percent",
            "bank",
            "hand-coins",
            "funding",
            "invoice",
            "safe-box",
          ],
        },
        navigation: {
          color: "#0d1b2a",
          label: "Navigation",
          icons: [
            "home",
            "menu",
            "arrow-right",
            "arrow-up-right",
            "chevron-down",
            "external-link",
            "compass",
            "map-pin",
            "globe",
            "layout-grid",
            "sidebar",
            "tab-bar",
            "breadcrumb",
            "search",
          ],
        },
        people: {
          color: "#b85e52",
          label: "People",
          icons: [
            "user",
            "users",
            "user-check",
            "user-plus",
            "hand-wave",
            "handshake",
            "message-circle",
            "message-square",
            "phone",
            "mail",
            "at-sign",
            "share",
            "eye",
            "smile",
          ],
        },
        notification: {
          color: "#c9a84c",
          label: "Notification",
          icons: [
            "bell",
            "bell-ring",
            "bell-dot",
            "megaphone",
            "volume",
            "inbox",
            "send",
            "upload",
            "download",
            "refresh",
            "zap",
            "info",
            "help-circle",
            "flag",
          ],
        },
        design: {
          color: "#5c5248",
          label: "Design",
          icons: [
            "palette",
            "paintbrush",
            "pen-tool",
            "image",
            "camera",
            "instagram",
            "youtube",
            "smartphone",
            "printer",
            "color-swatch",
            "type",
            "grid",
            "layers",
            "crop",
            "wand",
          ],
        },
      };

      const SCENES = [
        {
          file: "scenes/finance-scenes.html",
          title: "Finance Scenes",
          desc: "자금/금융 컨셉",
          count: 10,
          icon: "💰",
        },
        {
          file: "scenes/document-scenes.html",
          title: "Document Scenes",
          desc: "서류/절차 컨셉",
          count: 10,
          icon: "📄",
        },
        {
          file: "scenes/growth-scenes.html",
          title: "Growth Scenes",
          desc: "성장/진행 컨셉",
          count: 10,
          icon: "🌱",
        },
        {
          file: "scenes/trust-scenes.html",
          title: "Trust Scenes",
          desc: "보호/신뢰 컨셉",
          count: 10,
          icon: "🛡",
        },
        {
          file: "scenes/communication-scenes.html",
          title: "Communication — 기본",
          desc: "메시지/이메일/전화/화상",
          count: 10,
          icon: "💬",
        },
        {
          file: "scenes/communication-consult-scenes.html",
          title: "Communication — 상담/접수",
          desc: "상담시작/서류접수/양식작성",
          count: 10,
          icon: "🤝",
        },
        {
          file: "scenes/communication-progress-scenes.html",
          title: "Communication — 진행/소통",
          desc: "진행알림/현황확인/실시간채팅",
          count: 10,
          icon: "📊",
        },
        {
          file: "scenes/communication-approve-scenes.html",
          title: "Communication — 승인/완료",
          desc: "승인도장/계약서명/완료축하",
          count: 10,
          icon: "✅",
        },
        {
          file: "scenes/communication-connect-scenes.html",
          title: "Communication — 연결/관계",
          desc: "다리연결/퍼즐맞춤/등대안내",
          count: 10,
          icon: "🔗",
        },
        {
          file: "scenes/navigation-scenes.html",
          title: "Navigation Scenes",
          desc: "방향/탐색 컨셉",
          count: 10,
          icon: "🧭",
        },
      ];

      const upgradedSet = new Set();
      Object.values(UPGRADED_ICONS).forEach((cat) =>
        cat.icons.forEach((i) => upgradedSet.add(i)),
      );

      // ============ RENDER ============
      let currentSize = 32;
      let currentColor = "#2c2420";
      let currentTab = "icons";

      function renderIconGrid(containerId, data) {
        const container = document.getElementById(containerId);
        container.innerHTML = "";
        for (const [catKey, cat] of Object.entries(data)) {
          const section = document.createElement("div");
          section.className = "category";
          section.dataset.category = catKey;
          section.innerHTML = `
            <div class="cat-header">
              <div class="cat-dot" style="background:${cat.color}"></div>
              <span class="cat-name">${cat.label}</span>
              <span class="cat-count">${cat.icons.length}</span>
            </div>
            <div class="icon-grid">
              ${cat.icons
                .map(
                  (icon) => `
                <div class="icon-card ${upgradedSet.has(icon) ? "upgraded" : ""}" data-name="${icon}" data-category="${catKey}">
                  <object type="image/svg+xml" data="${catKey}/${icon}.svg"
                    width="${currentSize}" height="${currentSize}"
                    style="color:${currentColor}"></object>
                  <div class="name">${icon}</div>
                  ${upgradedSet.has(icon) ? '<div class="badge">HQ</div>' : ""}
                </div>
              `,
                )
                .join("")}
            </div>
          `;
          container.appendChild(section);
        }
      }

      function renderScenes() {
        const grid = document.getElementById("sceneGrid");
        grid.innerHTML = SCENES.map(
          (s) => `
          <a href="${s.file}" class="scene-card" style="text-decoration:none; color:inherit" target="_blank">
            <div class="scene-thumb">
              ${s.icon}
              <div class="overlay"><span class="overlay-text">Open Showcase</span></div>
            </div>
            <div class="scene-info">
              <h3>${s.title}</h3>
              <div class="scene-meta">
                <span>${s.desc}</span>
                <span><strong>${s.count}</strong> animations</span>
              </div>
            </div>
          </a>
        `,
        ).join("");
      }

      function switchTab(tab) {
        currentTab = tab;
        document
          .querySelectorAll(".tab-btn")
          .forEach((b) => b.classList.remove("active"));
        event.target.classList.add("active");
        document
          .querySelectorAll(".section")
          .forEach((s) => s.classList.remove("active"));
        document.getElementById("section-" + tab).classList.add("active");
        const controls = document.getElementById("icon-controls");
        controls.style.display = tab === "scenes" ? "none" : "flex";
      }

      function setSize(size) {
        currentSize = size;
        document.querySelectorAll(".size-btn").forEach((b) => {
          b.classList.toggle("active", b.textContent == size);
        });
        document.querySelectorAll(".icon-card object").forEach((obj) => {
          obj.setAttribute("width", size);
          obj.setAttribute("height", size);
        });
      }

      function setColor(color) {
        currentColor = color;
        document.querySelectorAll(".color-btn").forEach((b) => {
          b.classList.toggle(
            "active",
            b.style.background === color ||
              rgbToHex(b.style.background) === color,
          );
        });
        document.querySelectorAll(".icon-card object").forEach((obj) => {
          obj.style.color = color;
        });
      }

      function rgbToHex(rgb) {
        if (rgb.startsWith("#")) return rgb;
        const m = rgb.match(/\d+/g);
        if (!m) return rgb;
        return (
          "#" +
          m
            .slice(0, 3)
            .map((x) => (+x).toString(16).padStart(2, "0"))
            .join("")
        );
      }

      function filterIcons() {
        const q = document.getElementById("searchBox").value.toLowerCase();
        const activeSection = document.querySelector(".section.active");
        activeSection.querySelectorAll(".icon-card").forEach((card) => {
          const name = card.dataset.name;
          const cat = card.dataset.category;
          const match = name.includes(q) || cat.includes(q);
          card.classList.toggle("hidden", !match);
        });
        activeSection.querySelectorAll(".category").forEach((cat) => {
          const visible = cat.querySelectorAll(
            ".icon-card:not(.hidden)",
          ).length;
          cat.classList.toggle("hidden", visible === 0);
        });
      }

      // ============ INIT ============
      renderIconGrid("section-icons", UPGRADED_ICONS);
      renderIconGrid("section-all-icons", ALL_ICONS);
      renderScenes();
    </script>
  </body>
</html>
