<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <style>
    .pin-body {
      animation: pinDrop 3.5s cubic-bezier(0.34, 1.56, 0.64, 1) infinite;
      transform-origin: 12px 20px;
    }
    .pin-dot {
      animation: dotPop 3.5s cubic-bezier(0.34, 1.56, 0.64, 1) infinite;
      transform-origin: 12px 9px;
    }
    .pulse-ring {
      animation: pulseRing 3.5s ease-out infinite;
      transform-origin: 12px 20px;
      opacity: 0;
    }
    .shadow {
      animation: shadowScale 3.5s cubic-bezier(0.22, 1, 0.36, 1) infinite;
      transform-origin: 12px 21px;
      opacity: 0;
    }
    @keyframes pinDrop {
      0% { transform: translateY(-14px) scale(0.6); opacity: 0; }
      8% { opacity: 1; }
      22% { transform: translateY(2px) scale(1.02); }
      30% { transform: translateY(-3px) scale(0.98); }
      38% { transform: translateY(1px) scale(1.01); }
      44% { transform: translateY(-1px); }
      50%, 82% { transform: translateY(0px) scale(1); opacity: 1; }
      95% { transform: translateY(0px) scale(1); opacity: 0; }
      100% { transform: translateY(-14px) scale(0.6); opacity: 0; }
    }
    @keyframes dotPop {
      0%, 40% { transform: scale(0); opacity: 0; }
      50% { transform: scale(1.4); opacity: 1; }
      58% { transform: scale(0.85); }
      65% { transform: scale(1.1); }
      72%, 82% { transform: scale(1); opacity: 1; }
      95% { opacity: 0; }
      100% { transform: scale(0); opacity: 0; }
    }
    @keyframes pulseRing {
      0%, 45% { transform: scale(0.3); opacity: 0; }
      50% { opacity: 0.6; }
      70% { transform: scale(2); opacity: 0; }
      100% { opacity: 0; }
    }
    @keyframes shadowScale {
      0% { transform: scaleX(0.2); opacity: 0; }
      22% { transform: scaleX(1.3); opacity: 0.3; }
      30% { transform: scaleX(0.8); opacity: 0.2; }
      50%, 82% { transform: scaleX(1); opacity: 0.25; }
      95% { opacity: 0; }
      100% { transform: scaleX(0.2); opacity: 0; }
    }
  </style>
  <ellipse class="shadow" cx="12" cy="21" rx="4" ry="1" fill="currentColor" stroke="none" opacity="0.2" />
  <g class="pin-body">
    <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 11 7 11s7-5.75 7-11c0-3.87-3.13-7-7-7z" />
  </g>
  <circle class="pin-dot" cx="12" cy="9" r="2.5" />
  <circle class="pulse-ring" cx="12" cy="20" r="2" stroke-width="1.5" />
</svg>
