<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <style>
    .sidebar-panel {
      animation: sidebar-slide 2s ease-in-out infinite;
      transform-origin: 7px 12px;
    }
    @keyframes sidebar-slide {
      0%, 100% {
        transform: translateX(-2px);
      }
      50% {
        transform: translateX(0px);
      }
    }
  </style>
  <rect x="3" y="3" width="18" height="18" rx="2" />
  <rect class="sidebar-panel" x="3" y="3" width="6" height="18" rx="2" />
  <line x1="9.8" y1="6" x2="9.8" y2="18" />
  <line x1="12.5" y1="7" x2="18" y2="7" />
  <line x1="12.5" y1="11" x2="18" y2="11" />
  <line x1="12.5" y1="15" x2="18" y2="15" />
</svg>
