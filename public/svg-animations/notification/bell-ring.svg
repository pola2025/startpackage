  <path class="br-wave2" d="M0.5 9.5a6.5 6.5 0 0 1 0-8" stroke-width="1.5" />
  <path class="br-wave3" d="M22 3a4 4 0 0 1 0 5" stroke-width="1.5" />
  <path class="br-wave4" d="M23.5 1.5a6.5 6.5 0 0 1 0 8" stroke-width="1.5" />
