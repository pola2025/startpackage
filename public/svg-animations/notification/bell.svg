<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <style>
    .bell-swing {
      transform-origin: 12px 3px;
      animation: bellDamped 3.5s cubic-bezier(0.22, 1, 0.36, 1) infinite;
    }
    .bell-body-draw {
      stroke-dasharray: 60;
      stroke-dashoffset: 60;
      animation: drawBell 3.5s cubic-bezier(0.22, 1, 0.36, 1) infinite;
    }
    .bell-clapper {
      animation: clapperSwing 3.5s cubic-bezier(0.22, 1, 0.36, 1) infinite;
      transform-origin: 12px 17px;
    }
    @keyframes bellDamped {
      0%, 5% { transform: rotate(0deg); }
      12% { transform: rotate(-15deg); }
      20% { transform: rotate(12deg); }
      28% { transform: rotate(-9deg); }
      36% { transform: rotate(6deg); }
      42% { transform: rotate(-3deg); }
      48% { transform: rotate(1.5deg); }
      54%, 85% { transform: rotate(0deg); }
      100% { transform: rotate(0deg); }
    }
    @keyframes drawBell {
      0% { stroke-dashoffset: 60; }
      25% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes clapperSwing {
      0%, 5% { transform: translateX(0px); }
      12% { transform: translateX(2px); }
      20% { transform: translateX(-1.5px); }
      28% { transform: translateX(1px); }
      36% { transform: translateX(-0.5px); }
      44%, 100% { transform: translateX(0px); }
    }
  </style>
  <g class="bell-swing">
    <path class="bell-body-draw" d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9" />
    <g class="bell-clapper">
      <path d="M13.73 21a2 2 0 0 1-3.46 0" />
    </g>
  </g>
</svg>
