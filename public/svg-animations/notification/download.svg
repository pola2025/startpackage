<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <style>
    .dl-tray {
      stroke-dasharray: 20;
      stroke-dashoffset: 20;
      animation: drawTray 3.5s cubic-bezier(0.22, 1, 0.36, 1) infinite;
    }
    .dl-arrow-line {
      stroke-dasharray: 14;
      stroke-dashoffset: 14;
      animation: drawArrow 3.5s cubic-bezier(0.22, 1, 0.36, 1) infinite;
    }
    .dl-arrow-head {
      stroke-dasharray: 12;
      stroke-dashoffset: 12;
      animation: drawArrowHead 3.5s cubic-bezier(0.22, 1, 0.36, 1) infinite;
    }
    .dl-arrow-group {
      animation: arrowDrop 3.5s cubic-bezier(0.34, 1.56, 0.64, 1) infinite;
      transform-origin: 12px 12px;
    }
    .dl-impact {
      animation: impactRing 3.5s ease-out infinite;
      transform-origin: 12px 19px;
      opacity: 0;
    }
    @keyframes drawTray {
      0% { stroke-dashoffset: 20; }
      20% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes drawArrow {
      0% { stroke-dashoffset: 14; }
      25% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes drawArrowHead {
      0%, 10% { stroke-dashoffset: 12; }
      30% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes arrowDrop {
      0% { transform: translateY(-8px); opacity: 0; }
      10% { opacity: 1; }
      28% { transform: translateY(2px); }
      36% { transform: translateY(-3px); }
      44% { transform: translateY(1px); }
      50% { transform: translateY(-1px); }
      56%, 82% { transform: translateY(0px); opacity: 1; }
      95% { opacity: 0; }
      100% { transform: translateY(-8px); opacity: 0; }
    }
    @keyframes impactRing {
      0%, 25% { transform: scaleX(0.3); opacity: 0; }
      32% { transform: scaleX(1.5); opacity: 0.5; }
      45% { transform: scaleX(2); opacity: 0; }
      100% { opacity: 0; }
    }
  </style>
  <path class="dl-tray" d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
  <g class="dl-arrow-group">
    <line class="dl-arrow-line" x1="12" y1="3" x2="12" y2="15" />
    <polyline class="dl-arrow-head" points="7 10 12 15 17 10" />
  </g>
  <line class="dl-impact" x1="8" y1="19" x2="16" y2="19" stroke-width="1.5" />
</svg>
