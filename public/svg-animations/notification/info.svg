<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <style>
    .ring {
      stroke-dasharray: 63;
      stroke-dashoffset: 63;
      animation: ringDraw 2s ease-in-out infinite;
    }
    .info {
      opacity: 0;
      animation: iAppear 2s ease-in-out infinite;
    }
    @keyframes ringDraw {
      0% { stroke-dashoffset: 63; }
      55% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes iAppear {
      0%,50% { opacity: 0; }
      65%,100% { opacity: 1; }
    }
  </style>
  <circle class="ring" cx="12" cy="12" r="10" pathLength="63"/>
  <path class="info" d="M12 9v4"/>
  <circle class="info" cx="12" cy="16" r="1"/>
</svg>
