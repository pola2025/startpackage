<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <style>
    .plane-body {
      stroke-dasharray: 50;
      stroke-dashoffset: 50;
      animation: drawPlane 3.5s cubic-bezier(0.22, 1, 0.36, 1) infinite;
    }
    .plane-group {
      animation: planeLaunch 3.5s cubic-bezier(0.34, 1.56, 0.64, 1) infinite;
      transform-origin: 6px 12px;
    }
    .trail-1, .trail-2, .trail-3 {
      animation: trailFade 3.5s ease-out infinite;
      opacity: 0;
    }
    .trail-1 { animation-delay: 0.35s; }
    .trail-2 { animation-delay: 0.5s; }
    .trail-3 { animation-delay: 0.65s; }
    @keyframes drawPlane {
      0% { stroke-dashoffset: 50; }
      25% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes planeLaunch {
      0% { transform: translate(0px, 0px) scale(1); opacity: 0; }
      10% { opacity: 1; }
      25% { transform: translate(0px, 0px) scale(1); }
      45% { transform: translate(5px, -4px) scale(0.9); }
      55% { transform: translate(3px, -2px) scale(0.95); }
      65% { transform: translate(6px, -5px) scale(0.85); opacity: 1; }
      78% { transform: translate(8px, -6px) scale(0.7); opacity: 0; }
      80%, 100% { transform: translate(0px, 0px) scale(1); opacity: 0; }
    }
    @keyframes trailFade {
      0%, 25% { opacity: 0; stroke-dashoffset: 6; }
      40% { opacity: 0.5; stroke-dashoffset: 0; }
      55% { opacity: 0; }
      100% { opacity: 0; }
    }
  </style>
  <g class="plane-group">
    <path class="plane-body" d="M22 2L11 13" />
    <path class="plane-body" d="M22 2l-7 20-4-9-9-4 20-7z" />
  </g>
  <line class="trail-1" x1="2" y1="18" x2="5" y2="15" stroke-dasharray="6" stroke-width="1" />
  <line class="trail-2" x1="3" y1="20" x2="6" y2="17" stroke-dasharray="6" stroke-width="1" />
  <line class="trail-3" x1="1" y1="21" x2="4" y2="19" stroke-dasharray="6" stroke-width="1" />
</svg>
