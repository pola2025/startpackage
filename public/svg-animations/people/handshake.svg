<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <style>
    .left-hand {
      stroke-dasharray: 30;
      stroke-dashoffset: -30;
      animation: drawLeft 3.5s cubic-bezier(0.22, 1, 0.36, 1) infinite;
    }
    .right-hand {
      stroke-dasharray: 30;
      stroke-dashoffset: 30;
      animation: drawRight 3.5s cubic-bezier(0.22, 1, 0.36, 1) infinite;
    }
    .left-group {
      animation: slideFromLeft 3.5s cubic-bezier(0.34, 1.56, 0.64, 1) infinite;
    }
    .right-group {
      animation: slideFromRight 3.5s cubic-bezier(0.34, 1.56, 0.64, 1) infinite;
    }
    .clasp {
      animation: shake 3.5s cubic-bezier(0.22, 1, 0.36, 1) infinite;
      transform-origin: 12px 13px;
    }
    .spark {
      animation: sparkle 3.5s ease-out infinite;
      opacity: 0;
    }
    @keyframes drawLeft {
      0% { stroke-dashoffset: -30; }
      30% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes drawRight {
      0% { stroke-dashoffset: 30; }
      30% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes slideFromLeft {
      0% { transform: translateX(-6px); opacity: 0; }
      10% { opacity: 1; }
      25% { transform: translateX(0px); }
      100% { transform: translateX(0px); }
    }
    @keyframes slideFromRight {
      0% { transform: translateX(6px); opacity: 0; }
      10% { opacity: 1; }
      25% { transform: translateX(0px); }
      100% { transform: translateX(0px); }
    }
    @keyframes shake {
      0%, 35% { transform: rotate(0deg); }
      42% { transform: rotate(6deg); }
      50% { transform: rotate(-5deg); }
      58% { transform: rotate(4deg); }
      65% { transform: rotate(-2deg); }
      72%, 100% { transform: rotate(0deg); }
    }
    @keyframes sparkle {
      0%, 55% { opacity: 0; transform: scale(0); }
      65% { opacity: 0.8; transform: scale(1.2); }
      80% { opacity: 0; transform: scale(0.5); }
      100% { opacity: 0; }
    }
  </style>
  <g class="clasp">
    <g class="left-group">
      <path class="left-hand" d="M2 14l4-4 3 3" />
      <path class="left-hand" d="M6 10l-2-2 4-4 4 4" />
    </g>
    <g class="right-group">
      <path class="right-hand" d="M22 14l-4-4-3 3" />
      <path class="right-hand" d="M18 10l2-2-4-4-4 4" />
    </g>
    <path d="M9 13l3 3 3-3" />
    <line x1="12" y1="16" x2="12" y2="22" />
  </g>
  <circle class="spark" cx="12" cy="6" r="1" stroke-width="1" />
  <line class="spark" x1="8" y1="4" x2="7" y2="3" stroke-width="1" style="animation-delay: 0.15s" />
  <line class="spark" x1="16" y1="4" x2="17" y2="3" stroke-width="1" style="animation-delay: 0.3s" />
</svg>
