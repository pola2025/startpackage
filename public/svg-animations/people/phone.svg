<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <style>
    .phone-body {
      animation: phoneVibrate 3s cubic-bezier(0.22, 1, 0.36, 1) infinite;
      transform-origin: 12px 12px;
    }
    .sound-wave-1 {
      stroke-dasharray: 10;
      stroke-dashoffset: 10;
      animation: waveEmit1 3s ease-out infinite;
      opacity: 0;
    }
    .sound-wave-2 {
      stroke-dasharray: 14;
      stroke-dashoffset: 14;
      animation: waveEmit2 3s ease-out infinite;
      opacity: 0;
    }
    @keyframes phoneVibrate {
      0%, 50%, 100% { transform: rotate(0deg) translateX(0px); }
      5% { transform: rotate(-3deg) translateX(-1px); }
      10% { transform: rotate(3deg) translateX(1px); }
      15% { transform: rotate(-4deg) translateX(-1.5px); }
      20% { transform: rotate(4deg) translateX(1.5px); }
      25% { transform: rotate(-3deg) translateX(-1px); }
      30% { transform: rotate(3deg) translateX(1px); }
      35% { transform: rotate(-2deg) translateX(-0.5px); }
      40% { transform: rotate(1deg) translateX(0.5px); }
      45% { transform: rotate(0deg); }
    }
    @keyframes waveEmit1 {
      0%, 8% { stroke-dashoffset: 10; opacity: 0; transform: scale(0.8); }
      15% { stroke-dashoffset: 0; opacity: 0.7; transform: scale(1); }
      35% { opacity: 0; transform: scale(1.2); }
      100% { opacity: 0; }
    }
    @keyframes waveEmit2 {
      0%, 15% { stroke-dashoffset: 14; opacity: 0; transform: scale(0.8); }
      25% { stroke-dashoffset: 0; opacity: 0.5; transform: scale(1); }
      45% { opacity: 0; transform: scale(1.3); }
      100% { opacity: 0; }
    }
  </style>
  <g class="phone-body">
    <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z" />
  </g>
  <path class="sound-wave-1" d="M1.5 5.5a3 3 0 0 1 0-4" stroke-width="1.5" transform="translate(16, 0)" />
  <path class="sound-wave-2" d="M0.5 7a5 5 0 0 1 0-7" stroke-width="1.5" transform="translate(18.5, 0)" />
</svg>
