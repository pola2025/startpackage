<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <style>
    @keyframes pulseOut1 {
      0%, 100% { r: 3; opacity: 1; }
      50% { r: 4; opacity: 0.7; }
    }
    @keyframes pulseOut2 {
      0%, 100% { r: 3; opacity: 1; }
      60% { r: 4; opacity: 0.7; }
    }
    @keyframes pulseOut3 {
      0%, 100% { r: 3; opacity: 1; }
      70% { r: 4; opacity: 0.7; }
    }
    .dot1 { animation: pulseOut1 2s ease-in-out infinite; }
    .dot2 { animation: pulseOut2 2s ease-in-out infinite; }
    .dot3 { animation: pulseOut3 2s ease-in-out infinite; }
  </style>
  <circle class="dot1" cx="18" cy="5" r="3"/>
  <circle class="dot2" cx="6" cy="12" r="3"/>
  <circle class="dot3" cx="18" cy="19" r="3"/>
  <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/>
  <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/>
</svg>