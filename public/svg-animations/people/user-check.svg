<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <style>
    .uc-head {
      stroke-dasharray: 26;
      stroke-dashoffset: 26;
      animation: ucDrawHead 3.5s cubic-bezier(0.34, 1.56, 0.64, 1) infinite;
    }
    .uc-body {
      stroke-dasharray: 40;
      stroke-dashoffset: 40;
      animation: ucDrawBody 3.5s cubic-bezier(0.22, 1, 0.36, 1) infinite;
    }
    .uc-check {
      stroke-dasharray: 12;
      stroke-dashoffset: 12;
      animation: ucDrawCheck 3.5s cubic-bezier(0.34, 1.56, 0.64, 1) infinite;
    }
    .uc-check-group {
      animation: ucCheckBounce 3.5s cubic-bezier(0.34, 1.56, 0.64, 1) infinite;
      transform-origin: 20px 11px;
    }
    .uc-user-group {
      animation: ucUserAppear 3.5s cubic-bezier(0.22, 1, 0.36, 1) infinite;
      transform-origin: 8px 14px;
    }
    @keyframes ucDrawHead {
      0% { stroke-dashoffset: 26; }
      22% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes ucDrawBody {
      0%, 15% { stroke-dashoffset: 40; }
      40% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes ucDrawCheck {
      0%, 40% { stroke-dashoffset: 12; }
      60% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes ucCheckBounce {
      0%, 40% { transform: scale(0); opacity: 0; }
      50% { transform: scale(1.3); opacity: 1; }
      58% { transform: scale(0.85); }
      65% { transform: scale(1.1); }
      72%, 82% { transform: scale(1); opacity: 1; }
      95% { opacity: 0; }
      100% { transform: scale(0); opacity: 0; }
    }
    @keyframes ucUserAppear {
      0% { transform: translateY(4px); opacity: 0; }
      15% { opacity: 1; }
      25% { transform: translateY(-1px); }
      32% { transform: translateY(0.5px); }
      38%, 82% { transform: translateY(0px); opacity: 1; }
      95% { opacity: 0; }
      100% { opacity: 0; }
    }
  </style>
  <g class="uc-user-group">
    <path class="uc-body" d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" />
    <circle class="uc-head" cx="8.5" cy="7" r="4" />
  </g>
  <g class="uc-check-group">
    <polyline class="uc-check" points="17 11 19 13 23 9" />
  </g>
</svg>
