<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SVG Animation Archive Preview — 101 Icons</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        background: #f0f2f5;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        padding: 24px;
        color: #0d1b2a;
      }
      h1 {
        font-size: 24px;
        font-weight: 800;
        margin-bottom: 4px;
      }
      .subtitle {
        font-size: 13px;
        color: #5a7893;
        margin-bottom: 32px;
      }
      .category {
        margin-bottom: 40px;
      }
      .cat-title {
        font-size: 16px;
        font-weight: 700;
        margin-bottom: 12px;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .cat-title .dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
      }
      .cat-title .count {
        font-size: 11px;
        color: #5a7893;
        font-weight: 400;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
        gap: 12px;
      }
      .icon-card {
        background: #fff;
        border: 1px solid #c5cfd9;
        border-radius: 12px;
        padding: 16px 8px 10px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
        transition: all 0.2s;
      }
      .icon-card:hover {
        border-color: #0d1b2a;
        box-shadow: 0 2px 8px rgba(13, 27, 42, 0.12);
        transform: translateY(-2px);
      }
      .icon-card object,
      .icon-card img {
        width: 32px;
        height: 32px;
        color: #0d1b2a;
      }
      .icon-card .name {
        font-size: 9px;
        color: #5a7893;
        text-align: center;
        word-break: break-all;
      }
      .size-controls {
        margin-bottom: 24px;
        display: flex;
        gap: 8px;
        align-items: center;
      }
      .size-btn {
        padding: 4px 12px;
        border: 1px solid #c5cfd9;
        border-radius: 6px;
        background: #fff;
        cursor: pointer;
        font-size: 12px;
      }
      .size-btn.active {
        background: #0d1b2a;
        color: #fff;
        border-color: #0d1b2a;
      }
      .color-controls {
        display: flex;
        gap: 8px;
        align-items: center;
        margin-bottom: 24px;
      }
      .color-btn {
        width: 24px;
        height: 24px;
        border-radius: 50%;
        border: 2px solid transparent;
        cursor: pointer;
      }
      .color-btn.active {
        border-color: #0d1b2a;
      }
    </style>
  </head>
  <body>
    <h1>SVG Animation Archive</h1>
    <p class="subtitle">7 Categories / 101 Animated Icons — Click to inspect</p>

    <div class="size-controls">
      <span style="font-size: 12px; font-weight: 600">Size:</span>
      <button class="size-btn" onclick="setSize(24)">24px</button>
      <button class="size-btn active" onclick="setSize(32)">32px</button>
      <button class="size-btn" onclick="setSize(48)">48px</button>
      <button class="size-btn" onclick="setSize(64)">64px</button>
    </div>
    <div class="color-controls">
      <span style="font-size: 12px; font-weight: 600">Color:</span>
      <button
        class="color-btn active"
        style="background: #0d1b2a"
        onclick="setColor('#0d1b2a')"
      ></button>
      <button
        class="color-btn"
        style="background: #16a34a"
        onclick="setColor('#16a34a')"
      ></button>
      <button
        class="color-btn"
        style="background: #b85e52"
        onclick="setColor('#b85e52')"
      ></button>
      <button
        class="color-btn"
        style="background: #b08d3e"
        onclick="setColor('#b08d3e')"
      ></button>
      <button
        class="color-btn"
        style="background: #5a7893"
        onclick="setColor('#5a7893')"
      ></button>
    </div>

    <div id="container"></div>

    <script>
      const categories = {
        status: {
          color: "#16a34a",
          files: [
            "check-circle",
            "check-double",
            "circle-dot",
            "alert-triangle",
            "alert-circle",
            "x-circle",
            "clock",
            "hourglass",
            "loader-circle",
            "progress-ring",
            "shield-check",
            "trophy",
            "flame",
            "sparkles",
            "trending-up",
          ],
        },
        document: {
          color: "#1f3044",
          files: [
            "file-text",
            "file-check",
            "file-warning",
            "file-search",
            "clipboard-list",
            "clipboard-check",
            "folder-open",
            "folder-archive",
            "receipt",
            "stamp",
            "contract",
            "bookmark",
            "certificate",
            "id-card",
            "form-input",
          ],
        },
        finance: {
          color: "#b08d3e",
          files: [
            "wallet",
            "credit-card",
            "banknote",
            "coins",
            "piggy-bank",
            "chart-line",
            "chart-bar",
            "calculator",
            "percent",
            "bank",
            "hand-coins",
            "funding",
            "invoice",
            "safe-box",
          ],
        },
        navigation: {
          color: "#5a7893",
          files: [
            "home",
            "menu",
            "arrow-right",
            "arrow-up-right",
            "chevron-down",
            "external-link",
            "compass",
            "map-pin",
            "globe",
            "layout-grid",
            "sidebar",
            "tab-bar",
            "breadcrumb",
            "search",
          ],
        },
        people: {
          color: "#3b6080",
          files: [
            "user",
            "users",
            "user-check",
            "user-plus",
            "hand-wave",
            "handshake",
            "message-circle",
            "message-square",
            "phone",
            "mail",
            "at-sign",
            "share",
            "eye",
            "smile",
          ],
        },
        notification: {
          color: "#b85e52",
          files: [
            "bell",
            "bell-ring",
            "bell-dot",
            "megaphone",
            "volume",
            "inbox",
            "send",
            "upload",
            "download",
            "refresh",
            "zap",
            "info",
            "help-circle",
            "flag",
          ],
        },
        design: {
          color: "#8b3f35",
          files: [
            "palette",
            "paintbrush",
            "pen-tool",
            "image",
            "camera",
            "instagram",
            "youtube",
            "smartphone",
            "printer",
            "color-swatch",
            "type",
            "grid",
            "layers",
            "crop",
            "wand",
          ],
        },
      };

      const container = document.getElementById("container");

      for (const [cat, data] of Object.entries(categories)) {
        const section = document.createElement("div");
        section.className = "category";
        section.innerHTML = `<div class="cat-title"><span class="dot" style="background:${data.color}"></span>${cat} <span class="count">(${data.files.length})</span></div>`;
        const grid = document.createElement("div");
        grid.className = "grid";
        for (const file of data.files) {
          const card = document.createElement("div");
          card.className = "icon-card";
          card.innerHTML = `<object data="${cat}/${file}.svg" type="image/svg+xml" style="width:32px;height:32px;pointer-events:none;"></object><div class="name">${file}</div>`;
          grid.appendChild(card);
        }
        section.appendChild(grid);
        container.appendChild(section);
      }

      function setSize(px) {
        document.querySelectorAll(".icon-card object").forEach((el) => {
          el.style.width = px + "px";
          el.style.height = px + "px";
        });
        document
          .querySelectorAll(".size-btn")
          .forEach((b) => b.classList.remove("active"));
        event.target.classList.add("active");
      }

      function setColor(c) {
        document
          .querySelectorAll(".icon-card")
          .forEach((el) => (el.style.color = c));
        document
          .querySelectorAll(".color-btn")
          .forEach((b) => b.classList.remove("active"));
        event.target.classList.add("active");
      }
    </script>
  </body>
</html>
