<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <style>
    .ring {
      transform-origin: 12px 12px;
      animation: ring-pulse 3s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }
    .excl-line {
      transform-origin: 12px 10px;
      animation: excl-bounce 3s cubic-bezier(0.34, 1.56, 0.64, 1) infinite;
    }
    .excl-dot {
      transform-origin: 12px 16px;
      animation: dot-pop 3s cubic-bezier(0.34, 1.56, 0.64, 1) infinite;
    }
    @keyframes ring-pulse {
      0%, 100% { transform: scale(1); stroke-opacity: 0.7; }
      15% { transform: scale(1.06); stroke-opacity: 1; }
      30% { transform: scale(0.97); stroke-opacity: 0.85; }
      45% { transform: scale(1.03); stroke-opacity: 1; }
      60%, 85% { transform: scale(1); stroke-opacity: 1; }
    }
    @keyframes excl-bounce {
      0%, 5% { transform: translateY(-3px); opacity: 0; }
      15% { transform: translateY(1px); opacity: 1; }
      22% { transform: translateY(-1px); }
      30%, 75% { transform: translateY(0); opacity: 1; }
      90%, 100% { transform: translateY(-3px); opacity: 0; }
    }
    @keyframes dot-pop {
      0%, 18% { transform: scale(0); opacity: 0; }
      28% { transform: scale(1.6); opacity: 1; }
      35% { transform: scale(0.85); }
      42%, 75% { transform: scale(1); opacity: 1; }
      90%, 100% { transform: scale(0); opacity: 0; }
    }
  </style>
  <circle class="ring" cx="12" cy="12" r="10"/>
  <line class="excl-line" x1="12" y1="8" x2="12" y2="12"/>
  <line class="excl-dot" x1="12" y1="16" x2="12.01" y2="16"/>
</svg>
