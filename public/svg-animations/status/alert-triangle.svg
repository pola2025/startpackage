<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <style>
    .tri {
      stroke-dasharray: 60;
      stroke-dashoffset: 60;
      animation: tri-draw 3.5s cubic-bezier(0.25, 0.46, 0.45, 0.94) infinite;
    }
    .excl-line {
      transform-origin: 12px 11px;
      animation: line-fade 3.5s cubic-bezier(0.34, 1.56, 0.64, 1) infinite;
    }
    .excl-dot {
      transform-origin: 12px 17px;
      animation: dot-blink 3.5s cubic-bezier(0.34, 1.56, 0.64, 1) infinite;
    }
    @keyframes tri-draw {
      0%, 5% { stroke-dashoffset: 60; stroke-opacity: 0.3; }
      30% { stroke-dashoffset: 0; stroke-opacity: 1; }
      65% { stroke-dashoffset: 0; stroke-opacity: 1; }
      75% { stroke-dashoffset: 0; stroke-opacity: 0.6; }
      80% { stroke-dashoffset: 0; stroke-opacity: 1; }
      90%, 100% { stroke-dashoffset: 60; stroke-opacity: 0.3; }
    }
    @keyframes line-fade {
      0%, 25% { opacity: 0; transform: scaleY(0); }
      35% { opacity: 1; transform: scaleY(1.15); }
      42%, 65% { opacity: 1; transform: scaleY(1); }
      72% { opacity: 0.4; }
      78% { opacity: 1; }
      90%, 100% { opacity: 0; transform: scaleY(0); }
    }
    @keyframes dot-blink {
      0%, 32% { opacity: 0; transform: scale(0); }
      42% { opacity: 1; transform: scale(1.5); }
      48%, 65% { opacity: 1; transform: scale(1); }
      72% { opacity: 0.3; }
      78% { opacity: 1; }
      90%, 100% { opacity: 0; transform: scale(0); }
    }
  </style>
  <path class="tri" d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/>
  <line class="excl-line" x1="12" y1="9" x2="12" y2="13"/>
  <line class="excl-dot" x1="12" y1="17" x2="12.01" y2="17"/>
</svg>
