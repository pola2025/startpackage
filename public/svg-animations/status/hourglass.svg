<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <style>
    .hourglass {
      transform-origin: 12px 12px;
      animation: hg-flip 4s cubic-bezier(0.34, 1.56, 0.64, 1) infinite;
    }
    .sand-top {
      transform-origin: 12px 7px;
      animation: sand-drain 4s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }
    .sand-bot {
      transform-origin: 12px 17px;
      animation: sand-fill 4s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }
    .sand-stream {
      animation: stream-flow 4s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }
    @keyframes hg-flip {
      0%, 42% { transform: rotate(0deg); }
      48% { transform: rotate(-8deg); }
      55% { transform: rotate(185deg); }
      58% { transform: rotate(177deg); }
      62%, 100% { transform: rotate(180deg); }
    }
    @keyframes sand-drain {
      0%, 5% { transform: scaleY(1); opacity: 1; }
      38% { transform: scaleY(0.15); opacity: 0.6; }
      42%, 48% { transform: scaleY(0.15); opacity: 0; }
      62% { transform: scaleY(0.15); opacity: 0; }
      65% { transform: scaleY(1); opacity: 1; }
      100% { transform: scaleY(0.15); opacity: 0.6; }
    }
    @keyframes sand-fill {
      0%, 5% { transform: scaleY(0.15); opacity: 0.3; }
      38% { transform: scaleY(1); opacity: 1; }
      42%, 62% { transform: scaleY(1); opacity: 1; }
      65% { transform: scaleY(0.15); opacity: 0.3; }
      100% { transform: scaleY(1); opacity: 1; }
    }
    @keyframes stream-flow {
      0% { stroke-dashoffset: 0; opacity: 0.8; }
      38% { stroke-dashoffset: -4; opacity: 0.8; }
      42%, 62% { opacity: 0; }
      65% { opacity: 0.8; stroke-dashoffset: 0; }
      100% { stroke-dashoffset: -4; opacity: 0.8; }
    }
  </style>
  <g class="hourglass">
    <path d="M5 22h14"/>
    <path d="M5 2h14"/>
    <path d="M17 22v-4.172a2 2 0 00-.586-1.414L12 12l-4.414 4.414A2 2 0 007 17.828V22"/>
    <path d="M7 2v4.172a2 2 0 00.586 1.414L12 12l4.414-4.414A2 2 0 0017 6.172V2"/>
    <line class="sand-stream" x1="12" y1="11" x2="12" y2="13" stroke-dasharray="1 1"/>
  </g>
</svg>
