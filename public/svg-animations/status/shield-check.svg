<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <style>
    .shield-path {
      stroke-dasharray: 52;
      stroke-dashoffset: 52;
      animation: shield-draw 3.5s cubic-bezier(0.25, 0.46, 0.45, 0.94) infinite;
    }
    .shield-glow {
      stroke-dasharray: 52;
      stroke-dashoffset: 52;
      animation: shield-draw 3.5s cubic-bezier(0.25, 0.46, 0.45, 0.94) infinite;
      stroke-width: 4;
      opacity: 0;
    }
    .check-mark {
      stroke-dasharray: 10;
      stroke-dashoffset: 10;
      animation: check-pop 3.5s cubic-bezier(0.34, 1.56, 0.64, 1) infinite;
    }
    .check-wrap {
      transform-origin: 12px 13px;
      animation: check-scale 3.5s cubic-bezier(0.34, 1.56, 0.64, 1) infinite;
    }
    @keyframes shield-draw {
      0%, 5% { stroke-dashoffset: 52; stroke-opacity: 0.3; }
      30% { stroke-dashoffset: 0; stroke-opacity: 1; }
      70% { stroke-dashoffset: 0; stroke-opacity: 1; }
      90%, 100% { stroke-dashoffset: 52; stroke-opacity: 0.3; }
    }
    @keyframes check-pop {
      0%, 30% { stroke-dashoffset: 10; }
      45% { stroke-dashoffset: -0.5; }
      50%, 70% { stroke-dashoffset: 0; }
      90%, 100% { stroke-dashoffset: 10; }
    }
    @keyframes check-scale {
      0%, 30% { transform: scale(0); opacity: 0; }
      42% { transform: scale(1.25); opacity: 1; }
      48% { transform: scale(0.9); }
      54%, 70% { transform: scale(1); opacity: 1; }
      90%, 100% { transform: scale(0); opacity: 0; }
    }
  </style>
  <path class="shield-glow" d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
  <path class="shield-path" d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
  <g class="check-wrap">
    <path class="check-mark" d="M9 12l2 2 4-4"/>
  </g>
</svg>
