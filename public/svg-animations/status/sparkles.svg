<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <style>
    .spark {
      opacity: 0;
    }
    .s1 {
      transform-origin: 12px 8px;
      animation: twinkle1 3.5s cubic-bezier(0.34, 1.56, 0.64, 1) infinite;
    }
    .s2 {
      transform-origin: 20px 13px;
      animation: twinkle2 3.5s cubic-bezier(0.34, 1.56, 0.64, 1) infinite;
    }
    .s3 {
      transform-origin: 6px 19px;
      animation: twinkle3 3.5s cubic-bezier(0.34, 1.56, 0.64, 1) infinite;
    }
    @keyframes twinkle1 {
      0%, 5% { opacity: 0; transform: scale(0) rotate(-30deg); }
      15% { opacity: 1; transform: scale(1.15) rotate(5deg); }
      22% { transform: scale(0.95) rotate(-2deg); }
      28%, 55% { opacity: 1; transform: scale(1) rotate(0deg); }
      60% { opacity: 0.3; transform: scale(0.9); }
      65% { opacity: 1; transform: scale(1); }
      80%, 100% { opacity: 0; transform: scale(0) rotate(30deg); }
    }
    @keyframes twinkle2 {
      0%, 18% { opacity: 0; transform: scale(0) rotate(30deg); }
      28% { opacity: 1; transform: scale(1.2) rotate(-5deg); }
      35% { transform: scale(0.9) rotate(3deg); }
      42%, 60% { opacity: 1; transform: scale(1) rotate(0deg); }
      65% { opacity: 0.3; transform: scale(0.85); }
      70% { opacity: 1; transform: scale(1); }
      85%, 100% { opacity: 0; transform: scale(0) rotate(-30deg); }
    }
    @keyframes twinkle3 {
      0%, 32% { opacity: 0; transform: scale(0) rotate(-20deg); }
      42% { opacity: 1; transform: scale(1.25) rotate(8deg); }
      50% { transform: scale(0.88) rotate(-3deg); }
      56%, 68% { opacity: 1; transform: scale(1) rotate(0deg); }
      72% { opacity: 0.3; transform: scale(0.9); }
      76% { opacity: 1; transform: scale(1.05); }
      90%, 100% { opacity: 0; transform: scale(0) rotate(20deg); }
    }
  </style>
  <path class="spark s1" d="M12 3l1.5 3.5L17 8l-3.5 1.5L12 13l-1.5-3.5L7 8l3.5-1.5z"/>
  <path class="spark s2" d="M19 11l1 2 2 1-2 1-1 2-1-2-2-1 2-1z"/>
  <path class="spark s3" d="M5 17l1 2 2 1-2 1-1 2-1-2-2-1 2-1z"/>
</svg>
