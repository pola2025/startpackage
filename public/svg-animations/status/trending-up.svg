<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <style>
    .trend-line {
      stroke-dasharray: 30;
      stroke-dashoffset: 30;
      animation: line-draw 3.5s cubic-bezier(0.25, 0.46, 0.45, 0.94) infinite;
    }
    .arrow-head {
      transform-origin: 22px 7px;
      animation: arrow-pop 3.5s cubic-bezier(0.34, 1.56, 0.64, 1) infinite;
    }
    .arrow-path {
      stroke-dasharray: 14;
      stroke-dashoffset: 14;
      animation: arrow-draw 3.5s cubic-bezier(0.34, 1.56, 0.64, 1) infinite;
    }
    @keyframes line-draw {
      0%, 8% { stroke-dashoffset: 30; stroke-opacity: 0.3; }
      35% { stroke-dashoffset: 0; stroke-opacity: 1; }
      40% { stroke-dashoffset: -1; }
      45%, 70% { stroke-dashoffset: 0; stroke-opacity: 1; }
      88%, 100% { stroke-dashoffset: 30; stroke-opacity: 0.3; }
    }
    @keyframes arrow-pop {
      0%, 30% { transform: scale(0) translate(-2px, 2px); opacity: 0; }
      42% { transform: scale(1.3) translate(0, 0); opacity: 1; }
      48% { transform: scale(0.85); }
      55%, 70% { transform: scale(1); opacity: 1; }
      88%, 100% { transform: scale(0) translate(-2px, 2px); opacity: 0; }
    }
    @keyframes arrow-draw {
      0%, 30% { stroke-dashoffset: 14; }
      45%, 70% { stroke-dashoffset: 0; }
      88%, 100% { stroke-dashoffset: 14; }
    }
  </style>
  <polyline class="trend-line" points="22 7 13.5 15.5 8.5 10.5 2 17"/>
  <g class="arrow-head">
    <polyline class="arrow-path" points="16 7 22 7 22 13"/>
  </g>
</svg>
